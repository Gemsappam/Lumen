/* ============ LUMEN · design tokens ============ */
:root,:root[data-theme="light"]{
  --bg:#ffffff;          /* cards */
  --bg2:#f3f2ee;         /* page — warm paper */
  --bg3:#e9e7e1;         /* pressed / inset */
  --fg:#0c0c0c;
  --muted:#6b6863;
  --line:rgba(12,12,12,.09);
  --line2:rgba(12,12,12,.22);
  --rose:#0c0c0c;        /* accent = brand black (kept the old name: the code uses it) */
  --ink:#ffffff;         /* text on accent */
  --rose-soft:rgba(12,12,12,.06);
  --ok:#17784a; --warn:#a4620a; --err:#c3311f;
  --flow-bg:#0c0c0c; --flow-fg:#ffffff;
  --shadow:0 1px 0 rgba(12,12,12,.04),0 8px 24px -12px rgba(12,12,12,.14);
  --scrim:rgba(12,12,12,.45);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#171717;
  --bg2:#0b0b0b;
  --bg3:#222222;
  --fg:#f2f0eb;
  --muted:#8f8b84;
  --line:rgba(242,240,235,.08);
  --line2:rgba(242,240,235,.22);
  --rose:#f2f0eb;
  --ink:#0b0b0b;
  --rose-soft:rgba(242,240,235,.07);
  --ok:#4fc88f; --warn:#f1b544; --err:#ff6f5e;
  --flow-bg:#f2f0eb; --flow-fg:#0b0b0b;
  --shadow:0 0 0 1px rgba(242,240,235,.02),0 10px 30px -14px rgba(0,0,0,.8);
  --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}

html.theming,html.theming *{transition:background-color .3s ease,color .3s ease,border-color .3s ease!important}

/* ============ base ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg2);color:var(--fg);font-family:var(--text);font-size:15px;line-height:1.42;font-weight:500;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{padding:0 0 calc(env(safe-area-inset-bottom,0) + 112px)}
.num{font-variant-numeric:tabular-nums;font-weight:600}
::selection{background:var(--fg);color:var(--bg)}

/* ============ brand bar ============ */
.brandbar{position:sticky;top:0;z-index:12;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top,0) + 10px) 16px 10px;
  background:color-mix(in srgb,var(--bg2) 86%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line)}
.brandbar .mark{width:34px;height:34px;flex:none;background:var(--fg);color:var(--bg);display:grid;place-items:center;border-radius:8px}
.brandbar .mark svg{width:21px;height:21px}
.brandbar .wm{flex:1;min-width:0;line-height:1}
.brandbar .wm b{display:block;font-family:var(--cond);font-weight:600;font-size:19px;letter-spacing:.26em}
.brandbar .wm span{display:block;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:.01em}
.themeBtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:2px;padding:3px;border-radius:999px;background:var(--bg);border:1px solid var(--line2)}
.themeBtn i{width:30px;height:26px;display:grid;place-items:center;border-radius:999px;color:var(--muted);transition:background .25s,color .25s}
.themeBtn i svg{width:16px;height:16px}
:root[data-theme="light"] .themeBtn i.sun,:root[data-theme="dark"] .themeBtn i.moon{background:var(--fg);color:var(--bg)}
.themeBtn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

/* ============ type ============ */
h1{font-family:var(--cond);font-weight:800;text-transform:uppercase;font-size:36px;line-height:.95;letter-spacing:.005em;margin:22px 16px 6px;overflow-wrap:anywhere}
h2{font-family:var(--cond);font-weight:700;text-transform:uppercase;font-size:14px;letter-spacing:.13em;color:var(--muted);margin:26px 16px 10px;
  display:flex;flex-wrap:wrap;align-items:center;gap:6px}
h2 .s{flex-basis:100%;font-family:var(--text)}
.sub{color:var(--muted);margin:0 16px 14px;font-size:14px;font-weight:500}
.hint{font-size:13px;color:var(--muted);margin:8px 16px 0;font-weight:500}
.big{font-family:var(--cond);font-size:34px;font-weight:800;line-height:1;letter-spacing:-.005em;font-variant-numeric:tabular-nums}

/* ============ cards & rows ============ */
.group{background:var(--bg);margin:0 12px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.row:last-child{border-bottom:0}
.row:active{background:var(--rose-soft)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;font-size:15.5px;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s,.s{font-size:13px;color:var(--muted);font-weight:500}
.row .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .v .num,.row .v>div:first-child{font-family:var(--cond);font-weight:800;font-size:19px;letter-spacing:.005em}
.row .v .s{font-family:var(--text)}
.row input[type=checkbox]{accent-color:var(--fg);width:18px;height:18px}

.row.wrap{flex-wrap:wrap}
.rowbtns{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px}
.rowbtns:empty{display:none}
button.sm{padding:8px 12px;font-size:13.5px;border-radius:10px;flex:none}
.row .s.num{font-family:var(--text);font-weight:500}

/* pills: tag-like, condensed caps */
.pill{display:inline-block;font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 8px 1px;border-radius:6px;border:1.5px solid var(--line2);color:var(--fg);background:transparent;white-space:nowrap;vertical-align:1px}
.pill.ok{border-color:color-mix(in srgb,var(--ok) 55%,transparent);color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,transparent)}
.pill.warn,.pill.ok{margin:0;padding:2px 8px 1px;border-radius:6px;border-width:1.5px;border-style:solid;font-size:12px}
.pill.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent);color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.row>.pill{flex:none}

/* the one bold thing: money flow of a top-up */
.flow{margin:8px 12px 0;background:var(--flow-bg);color:var(--flow-fg);border-radius:var(--r);padding:18px 18px 14px;
  display:grid;grid-template-columns:1fr auto 1fr;gap:6px 12px;align-items:end;position:relative;overflow:hidden}
.flow::after{content:"";position:absolute;right:-26px;top:-30px;width:150px;height:150px;opacity:.08;background:currentColor;
  -webkit-mask:var(--markmask) center/contain no-repeat;mask:var(--markmask) center/contain no-repeat;pointer-events:none}
.flow{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.flow .big{font-size:clamp(26px,8.4vw,36px);white-space:nowrap}
.flow .lbl{font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.65;margin-bottom:4px}
.flow .arrow{font-size:22px;opacity:.5;align-self:center}
.flow .foot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:space-between;border-top:1px solid color-mix(in srgb,currentColor 22%,transparent);
  margin-top:12px;padding-top:11px;font-size:13px;font-weight:600}

/* ============ buttons ============ */
.actions{display:flex;gap:8px;margin:14px 12px}
.actions button{flex:1}
button{font:inherit;font-family:var(--cond);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;
  border:1.5px solid var(--line2);border-radius:12px;padding:12px 14px;background:var(--bg);color:var(--fg);cursor:pointer;
  transition:transform .08s,background .15s,border-color .15s}
button:active{transform:scale(.975)}
button:hover{border-color:var(--fg)}
button.primary{background:var(--rose);border-color:var(--rose);color:var(--ink)}
button.ghost{background:transparent;border-color:transparent;color:var(--fg);padding:8px;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1.5px}
button.x{color:var(--err);background:none;border:0;padding:4px 8px;font-size:22px;line-height:1;text-transform:none;letter-spacing:0}
button:disabled{opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.seg{background:var(--bg3);padding:3px;border-radius:13px}
.seg button{border:0;background:transparent;font-size:14px;padding:10px 8px;border-radius:10px;color:var(--muted)}
.seg button.primary{background:var(--bg);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ============ notices ============ */
.warn{margin:12px 12px 0;padding:11px 14px;border-radius:12px;font-size:13.5px;font-weight:500;
  background:color-mix(in srgb,var(--warn) 11%,var(--bg));border:1px solid color-mix(in srgb,var(--warn) 28%,transparent);border-left:4px solid var(--warn)}
.warn div+div{margin-top:5px}
.issue{padding:11px 15px;border-bottom:1px solid var(--line);font-size:14px}
.issue b{display:block;font-weight:700}
.issue.error b{color:var(--err)} .issue.warning b{color:var(--warn)}
.issue .fix{color:var(--muted);font-size:13px;margin-top:2px}
.empty{padding:28px 18px;text-align:center;color:var(--muted);font-weight:500}
.empty::before{content:"";display:block;width:30px;height:30px;margin:0 auto 10px;background:currentColor;opacity:.45;
  -webkit-mask:var(--markmask) center/contain no-repeat;mask:var(--markmask) center/contain no-repeat}

/* ============ forms ============ */
form{margin:0}
input,select,textarea{color:var(--fg);font-family:inherit;background:var(--bg);border:1.5px solid var(--line2);border-radius:12px;padding:11px 13px;font-size:16px;font-weight:600;min-width:0}
input[type=checkbox],input[type=radio]{padding:0;border-radius:4px;accent-color:var(--fg)}
.field{display:flex;flex-direction:column;padding:9px 15px 7px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{border:0;background:transparent;color:var(--fg);font:inherit;font-weight:600;font-size:16px;padding:5px 0;width:100%;border-radius:0}
.field:focus-within{background:var(--rose-soft)}
input::placeholder,textarea::placeholder{color:var(--muted);font-weight:500;opacity:.8}
.two{display:grid;grid-template-columns:1fr 1fr}
.two .field:first-child{border-right:1px solid var(--line)}
.lines{width:100%;border-collapse:collapse;font-size:13.5px}
.lines th{font-family:var(--cond);font-weight:700;color:var(--muted);text-align:left;padding:8px 4px;text-transform:uppercase;font-size:11.5px;letter-spacing:.08em;white-space:nowrap}
.lines td{padding:2px 2px;border-top:1px solid var(--line)}
.lines input{width:100%;border:0;background:transparent;color:var(--fg);font:inherit;font-weight:600;padding:8px 4px;font-variant-numeric:tabular-nums}
.lines td.calc{color:var(--muted);text-align:right;padding-right:6px;white-space:nowrap}
.scroll{overflow-x:auto}
.drop{margin:0 12px;border:1.5px dashed var(--line2);border-radius:var(--r);padding:20px 16px;text-align:center;color:var(--fg);background:var(--bg);cursor:pointer;
  font-family:var(--cond);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.drop:hover{border-color:var(--fg)}
.drop.busy{opacity:.55;pointer-events:none}
.ro #farms,.ro #save,.ro #del,.ro .x,.ro .drop,.ro #addLine,.ro #new,.ro #addInv,.ro #addLog,.ro #addRow,.ro #edit,.ro #delTop,.ro #act,.ro #audit,.ro #drafts{display:none!important}
.ro input,.ro select,.ro textarea{pointer-events:none;opacity:.85}
.ro .seg button,.ro #tq input{pointer-events:auto;opacity:1}

/* ============ tab bar ============ */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;z-index:10;
  padding:6px 6px calc(8px + env(safe-area-inset-bottom,0));
  background:color-mix(in srgb,var(--bg) 95%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabbar button{flex:1;background:transparent;border:0;border-radius:12px;padding:4px 2px 2px;position:relative;
  font-family:var(--cond);font-size:12px;font-weight:700;letter-spacing:.09em;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:4px}
.tabbar button.on{color:var(--fg)}
.tabbar button .i{width:56px;height:30px;display:grid;place-items:center;border-radius:999px;transition:background .2s,color .2s}
.tabbar button.on .i{background:var(--fg);color:var(--bg)}
.tabbar button.on .i svg{stroke-width:2.1}
.tabbar button:active{transform:scale(.94)}

/* ============ toast & sheets ============ */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0));transform:translate(-50%,8px);background:var(--fg);color:var(--bg);
  padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90%;z-index:30;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast,.row,button,.themeBtn i{transition:none}}
</style>
</head>

<button class="themeBtn" id="themeBtn" type="button" aria-label="Светлая / тёмная тема" title="Светлая / тёмная тема"><i class="sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></i><i class="moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></i></button></header>

<script>
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
// ---------- theme: light / dark, remembered per device ----------
function paintTelegram(){ const c=getComputedStyle(document.documentElement), bg2=c.getPropertyValue('--bg2').trim(), bg=c.getPropertyValue('--bg').trim();
  try{ tg?.setHeaderColor?.(bg2); tg?.setBackgroundColor?.(bg2); tg?.setBottomBarColor?.(bg) }catch(e){} }
function setTheme(t, save=true){ const h=document.documentElement; h.classList.add('theming'); h.dataset.theme=t;
  if(save){ try{ localStorage.setItem('lumen_theme',t) }catch(e){} }
  paintTelegram(); setTimeout(()=>h.classList.remove('theming'),350); }
document.getElementById('themeBtn').onclick=()=>{ setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'); try{tg?.HapticFeedback?.selectionChanged()}catch(e){} };
paintTelegram();
const $app = document.getElementById('app');
const fmt = (n, d=0) => n==null||n==='' ? '—' : Number(n).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const numOrNull = v => v===''||v==null ? null : Number(String(v).replace(',','.').replace(/\s/g,''));
const dm = v => { const x=String(v||''); const m=x.match(/^(\d{4})-(\d{2})-(\d{2})/); return m?m[3]+'.'+m[2]:x.slice(0,5) };
const today = () => new Date().toLocaleDateString('ru-RU');
async function payDebt(farm, debt){
  const tops=await api('/topups');
  const w=document.createElement('div');
  w.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end';
  w.innerHTML=`<div style="background:var(--bg2);width:100%;border-radius:16px 16px 0 0;padding:14px 0 calc(16px + env(safe-area-inset-bottom,0))">
    <h2 style="margin-top:4px">Оплата долга · ${esc(farm)}</h2>
    <form class="group" id="pd">
      <div class="field"><label>Из пополнения</label><select name="t">${tops.map(t=>`<option value="${t.id}">${esc(t.date)}${t.rate?' · курс '+fmt(t.rate,2):''}</option>`).join('')}</select></div>
      <div class="two"><div class="field"><label>Оплачено, $ (с костами)</label><input name="u" inputmode="decimal" value="${debt}"></div>
      <div class="field"><label>Дошло до фермы, $</label><input name="c" inputmode="decimal" value="${debt}"></div></div>
      <div class="field"><label>₽ (пусто = $ × курс пополнения)</label><input name="r" inputmode="decimal"></div></form>
    <p class="hint" style="margin:6px 16px">Долг закроется по курсу этого пополнения, и себестоимость тех стеблей пересчитается.</p>
    <div class="actions"><button id="pdc">Отмена</button><button class="primary" id="pdo">Записать оплату</button></div></div>`;
  document.body.appendChild(w);
  w.querySelector('#pdc').onclick=()=>w.remove();
  w.querySelector('#pdo').onclick=async()=>{const f=w.querySelector('#pd');
    const b={farm,topup_id:+f.t.value,usd_sent:numOrNull(f.u.value),usd_credited:numOrNull(f.c.value),rub:numOrNull(f.r.value)};
    if(!b.usd_sent) return toast('Укажи сумму');
    try{const r=await api('/farm_payment',{method:'POST',body:b}); w.remove(); toast(r.text); if((document.querySelector('h1')?.textContent||'').includes('Расчёты')) render('ledger',{})}catch(e){toast(e.message)}};
}


function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2600)}

async function api(path, opt={}){
  const headers = {'X-Init-Data': tg?.initData||''};
  if (opt.body && !(opt.body instanceof FormData)){headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}
  const r = await fetch('/api'+path,{...opt,headers});
  if(!r.ok){const t=await r.text();throw new Error(t.slice(0,200))}
  return r.json();
}

// ---------- tiny router with Telegram back button ----------
const stack=[];
function go(view, args={}, push=true){ if(push) stack.push([view,args]); render(view,args) }
function back(){ stack.pop(); const [v,a]=stack[stack.length-1]||['home',{}]; render(v,a) }
tg?.BackButton.onClick(back);
const ICONS={"home": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 7V5.5A1.5 1.5 0 0 0 17.5 4H5a2 2 0 0 0 0 4h14a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V6\"/><path d=\"M16 14h.01\"/></svg>", "transit": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z\"/></svg>", "stock": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5a3 3 0 1 1 3 3m-3-3a3 3 0 1 0-3 3m3-3v1M9 8a3 3 0 1 0 3 3M9 8h1m5 0a3 3 0 1 1-3 3m3-3h-1m-2 3v-1\"/><circle cx=\"12\" cy=\"8\" r=\"2\"/><path d=\"M12 10v12\"/><path d=\"M12 22c4.2 0 7-1.7 7-5-4.2 0-7 1.7-7 5z\"/><path d=\"M12 22c-4.2 0-7-1.7-7-5 4.2 0 7 1.7 7 5z\"/></svg>", "more": "<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3.5\" y=\"3.5\" width=\"7\" height=\"7\" rx=\"1.8\"/><rect x=\"13.5\" y=\"3.5\" width=\"7\" height=\"7\" rx=\"1.8\"/><rect x=\"3.5\" y=\"13.5\" width=\"7\" height=\"7\" rx=\"1.8\"/><rect x=\"13.5\" y=\"13.5\" width=\"7\" height=\"7\" rx=\"1.8\"/></svg>"};
const TABS=[['home',ICONS.home,'Откупы'],['transit',ICONS.transit,'В пути'],['stock',ICONS.stock,'Остатки'],['more',ICONS.more,'Ещё']];
const TAB_OF={archive:'more',blockers:'transit',autolog:'more',ledger:'more',marks:'more',home:'home',topup:'home',topupForm:'home',draft:'home',invoice:null,logistics:null,weights:'home',
  transit:'transit',transitInv:'transit',stock:'stock',more:'more',farms:'more',farm:'more',users:'more'};
let CUR_TAB='home';
function tab(v){ stack.length=0; go(v) }
function drawTabs(){
  const tabs=TABS.filter(([v])=>v!=='more'||ME?.can_write);
  document.getElementById('tabbar').innerHTML=tabs.map(([v,i,t])=>`<button class="${CUR_TAB===v?'on':''}" data-tab="${v}"><span class="i">${i}</span>${t}</button>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
}
async function render(view,args){
  if(TAB_OF[view]) CUR_TAB=TAB_OF[view];
  stack.length>1 ? tg?.BackButton.show() : tg?.BackButton.hide();
  window.scrollTo(0,0);
  try{ await whoami(); drawTabs(); await VIEWS[view](args) }catch(e){ $app.innerHTML=`<div class="empty">Не загрузилось: ${esc(e.message)}</div>` }
}

let FARMS=[], ME=null, MONEY={}, MARK=null;
async function whoami(){ if(!ME){ ME=await api('/me'); document.body.classList.toggle('ro',!ME.can_write);
    try{ MARK=(await api('/settings/marking')).marking }catch(e){} }
  if(ME.sees_money){ try{MONEY=await api('/money')}catch(e){} } }
const VIEWS = {

// ======================= HOME =======================
async home(){
  await whoami();
  const [tops, drafts] = await Promise.all([api('/topups'), ME.can_write?api('/drafts'):Promise.resolve([])]);

`;

  document.getElementById('clearDrafts')?.addEventListener('click',async()=>{ if(!confirm(`Удалить все черновики (${drafts.length})?`))return;

    <div class="field"><label>Как делить ₽ по строкам</label><select name="alloc_mode">
      <option value="value" ${inv.alloc_mode==='value'?'selected':''}>По стоимости строк (разные цены)</option>
      <option value="stems" ${inv.alloc_mode==='stems'?'selected':''}>Поровну на стебель (одна цена)</option></select></div>
    <div class="two"><div class="field"><label>Оплачено</label><select name="paid"><option value="1" ${inv.paid?'selected':''}>да</option><option value="0" ${!inv.paid?'selected':''}>нет</option></select></div>

    <div class="field"><label>Комментарий</label><input name="note" value="${esc(inv.note)}"></div>
  </form>
  ${inv.id?`<h2>Статус груза</h2><div class="group"><div class="row"><div class="grow">
      <div class="t">${inv.arrived_at?'📦 Прибыл':'🚚 В пути'}</div><div class="s">${inv.arrived_at?esc(inv.arrived_at):(inv.eta?'прибытие '+esc(inv.eta.replace('T',' ')):'ждёт сообщения ТК МСК о машине')}</div></div>
      <button id="arrToggle">${inv.arrived_at?'Вернуть в «В пути»':'Отметить прибывшим'}</button></div></div>`:''}
  <div class="actions">${inv.id?'<button id="del" class="x">Удалить</button>':''}<button class="primary" id="save">Сохранить</button></div>`;
  document.getElementById('arrToggle')?.addEventListener('click',async()=>{
    await api(`/invoices/${inv.id}/arrived${inv.arrived_at?'?back=true':''}`,{method:'POST'});
    inv.arrived_at = inv.arrived_at ? null : 'только что (вручную)';
    toast(inv.arrived_at?'Отмечен прибывшим':'Вернул в «В пути»'); render('invoice',{t,inv});
  });

  const tb=document.getElementById('lines'), f=document.getElementById('f'), p=document.getElementById('p');
  const drawLines=()=>{tb.innerHTML=inv.lines.map((l,i)=>`<tr data-i="${i}">
    <td><input data-k="name" value="${esc(l.name)}"></td><td><input data-k="boxes" inputmode="decimal" size="3" value="${l.boxes??''}"></td>
    <td><input data-k="stems" inputmode="numeric" size="5" value="${l.stems??''}"></td><td><input data-k="weight_kg" inputmode="decimal" size="3" value="${l.weight_kg??''}"></td>
    <td><input data-k="price_usd" inputmode="decimal" size="4" value="${l.price_usd??''}"></td>
    <td class="calc" data-c="${i}"></td><td><button class="x" data-rm="${i}">×</button></td></tr>`).join(''); sums()};
  // ---- live money: $ → ₽ by the top-up rate, ₽/stem recalculated on every keystroke ----
  const rateNow=()=>(TOPS.find(x=>x.id===+f.topup.value)||t).rate||t.rate;
  let rubAuto = inv.rub_paid_override==null || inv.usd_paid==='' ||
                Math.abs(inv.rub_paid_override - Math.round((inv.usd_paid||0)*rateNow()))<=1;
  const showMode=()=>{const m=document.getElementById('rubMode');
    m.innerHTML=rubAuto?`авто · $ × ${fmt(rateNow(),2)}`:'вручную · <u style="cursor:pointer">по курсу</u>';
    m.onclick=rubAuto?null:()=>{rubAuto=true;syncRub();sums()}};
  const syncRub=()=>{ if(!rubAuto) return; const u=numOrNull(p.usd_paid.value);
    p.rub_paid_override.value = u ? Math.round(u*rateNow()) : '' };
  const sums=()=>{
    const st=inv.lines.reduce((a,l)=>a+(numOrNull(l.stems)||0),0);
    const val=inv.lines.reduce((a,l)=>a+(numOrNull(l.stems)||0)*(numOrNull(l.price_usd)||0),0);
    document.getElementById('sumLines').textContent=`${fmt(st)} стеблей · строки $${fmt(val,2)}`;
    const usd=numOrNull(p.usd_paid.value), rub=numOrNull(p.rub_paid_override.value);
    const perStem=p.alloc_mode.value==='stems';
    const tr=document.getElementById('trueRate');
    // ledger-aware: invoice is paid by «дошло до фермы»; the rest is debt (or an advance stays at the farm)
    const T = numOrNull(p.invoice_total_usd.value) || val;
    const F = numOrNull(p.farm_usd.value) || T;
    // advance the farm already had: for a saved invoice — what it actually used; for a new one — current advance
    const fl = LED.farms.find(x=>x.farm.toLowerCase()===(f.farm.value||'').trim().toLowerCase());
    const A = inv.id ? (BB?.advance||0) : (fl?.advance_usd||0);
    const fb = document.getElementById('farmBal');
    if(fb){
      if(inv.id && inv.ledger && numOrNull(p.farm_usd.value)===(inv.farm_usd??null)){   // saved & unchanged: real ledger
        const L=inv.ledger, parts=(L.parts||[]).map(x=>`$${fmt(x.usd,2)} × ${fmt(x.rate,2)} (${esc(x.src)})`).join(' + ');
        fb.innerHTML = L.debt_usd>0.005
          ? `<span style="color:var(--err)">Долг ферме: $${fmt(L.debt_usd,2)}</span> <span class="s">(закрыто: ${parts||'—'})</span>`
            + ` <button type="button" class="ghost" onclick="payDebt('${esc(f.farm.value)}',${L.debt_usd.toFixed(2)})">Оплатить долг</button>`
          : `<span style="color:var(--ok)">✓ Инвойс $${fmt(T,2)} закрыт полностью</span> <span class="s">= ${parts}</span>`;
        if(rub && F){ const k=rub/F, r=rateNow(); if(k<r*0.98) fb.innerHTML+=`<div style="color:var(--warn);margin-top:4px">⚠️ ${fmt(k,2)} ₽ за 1 $ фермы — меньше курса пополнения ${fmt(r,2)}: проверь суммы.</div>` }
      } else {
      const d = F + A - T;
      const why = BB && A>0.005 ? ' ← ' + (BB.from.length ? BB.from.join('; ') : BB.advances.map(x=>`$${fmt(x.usd,2)} от ${x.from}`).join('; ')) : '';
      const how = `инвойс $${fmt(T,2)} − дошло $${fmt(F,2)}` + (A>0.005?` − аванс фермы $${fmt(A,2)}${why}`:'');
      fb.innerHTML = !T ? '' : Math.abs(d) < 0.01 ? `<span style="color:var(--ok)">✓ Инвойс закрыт полностью</span> <span class="s">(${how.replace(' − дошло',' = дошло').replace('инвойс ','')})</span>`
        : d < 0 ? `<span style="color:var(--err)">Долг ферме: $${fmt(-d,2)}</span> <span class="s">(${how})</span>`
          + (inv.id?` <button type="button" class="ghost" onclick="payDebt('${esc(f.farm.value)}',${(-d).toFixed(2)})">Оплатить долг</button>`:'')
        : `<span style="color:var(--ok)">Аванс у фермы: $${fmt(d,2)}</span> <span class="s">(${how}; зачтётся в следующий инвойс)</span>`;
      if(rub && F){
        const k = rub / F, r = rateNow();
        if(k < r*0.98) fb.innerHTML += `<div style="color:var(--warn);margin-top:4px">⚠️ ${fmt(k,2)} ₽ за 1 $ фермы — это меньше курса пополнения ${fmt(r,2)}. Так не бывает: проверь «Оплачено, ₽» и «Дошло до фермы».</div>`;
      }
      }
    }
    if(tr && rub && val && !perStem){
      const k = rub / F, cost = k * T;                       // debt part ≈ at the same rate until it is paid
      tr.textContent=`Истинный курс ≈ ${fmt(cost/val,4)} ₽/$: ${fmt(k,2)} ₽ за каждый $, дошедший до фермы (курс ${fmt(rateNow(),2)} + косты ${fmt(((usd||0)/F-1)*100,1)}%).`;
    }
    inv.lines.forEach((l,i)=>{const c=tb.querySelector(`[data-c="${i}"]`); if(!c) return;
      const flower = !rub ? null : perStem ? (st? rub/st : null) : (val ? (numOrNull(l.price_usd)||0)*rub/val : null);
      const logi=(l.air_rub||0)+(l.msk_rub||0);
      c.textContent = flower==null ? '' : fmt(flower+logi,2);
      c.title = logi ? `цветок ${fmt(flower||0,2)} + логистика ${fmt(logi,2)}` : '';
    });
    showMode();
  };
  tb.oninput=e=>{const tr=e.target.closest('tr'),k=e.target.dataset.k;inv.lines[tr.dataset.i][k]=e.target.value;sums()};
  tb.onclick=e=>{if(e.target.dataset.rm!=null){inv.lines.splice(+e.target.dataset.rm,1);drawLines()}};
  p.oninput=e=>{
    if(e.target.name==='usd_paid'){ rubAuto=true; syncRub(); }          // changed $ → ₽ follows the rate
    if(e.target.name==='rub_paid_override') rubAuto = p.rub_paid_override.value.trim()==='';   // typed ₽ by hand → keep it
    if(e.target.name==='rub_paid_override' && rubAuto) syncRub();
    sums()};
  p.onchange=p.oninput;
  const unpaidMode=()=>{const u=!+f.topup.value; document.getElementById('usdLbl').textContent=u?'Примерно $ (не оплачен)':'Оплачено, $';
    p.rub_paid_override.closest('.field').style.display=u?'none':'';
    p.paid.closest('.two').style.display=u?'none':'';
    document.getElementById('farmUsdF').style.display=u?'none':'';
    if(u) p.paid_date.value=''; else if(!p.paid_date.value) p.paid_date.value=new Date().toLocaleDateString('ru-RU')};
  f.topup.addEventListener('change',()=>{unpaidMode();syncRub();sums()});
  if(!inv.topup_id && inv.est_usd && !inv.usd_paid) p.usd_paid.value=inv.est_usd;
  unpaidMode();
  f.farm.onchange=()=>{const m=FARMS.find(x=>x.name.toLowerCase()===f.farm.value.toLowerCase());if(m&&!f.country.value)f.country.value=m.country};
  document.getElementById('addLine').onclick=()=>{inv.lines.push({name:'',stems:'',price_usd:''});drawLines()};
  drawLines();

  const drop=document.getElementById('drop'), file=document.getElementById('file');
  drop.onclick=()=>file.click();
  file.onchange=async()=>{ if(!file.files[0])return; drop.classList.add('busy'); drop.textContent='Читаю документ…';
    try{const fd=new FormData();fd.append('file',file.files[0]);const r=await api('/parse',{method:'POST',body:fd});
      collect(); applyParsed(inv,r); stack[stack.length-1][1]={t,inv}; render('invoice',{t,inv}); }
    catch(x){toast(x.message);drop.classList.remove('busy');drop.textContent='Загрузить PDF или фото инвойса — AI заполнит'} };
  if(inv._warnings?.length) document.getElementById('aiwarn').innerHTML=`<div class="warn">${inv._warnings.map(w=>`<div>${esc(w)}</div>`).join('')}</div>`;

  function collect(){
    for(const k of ['farm','country','invoice_no','invoice_date','awb','client_code']) inv[k]=f[k].value.trim();
    inv.weight_kg=numOrNull(f.weight_kg.value);
    for(const k of ['invoice_total_usd','usd_paid','rub_paid_override','farm_usd']) inv[k]=numOrNull(p[k].value);
    if(!+f.topup.value){ inv.est_usd=inv.usd_paid; inv.usd_paid=0; inv.rub_paid_override=null; inv.paid=false }
    inv.alloc_mode=p.alloc_mode.value; inv.paid=p.paid.value==='1'; inv.paid_date=p.paid_date.value; inv.note=p.note.value;
    inv.topup_id=+f.topup.value;
  }
  document.getElementById('save').onclick=async()=>{
    collect();
    if(!inv.farm) return toast('Укажи плантацию');
    if(inv.topup_id && (!inv.usd_paid||!inv.rub_paid_override)) return toast('Впиши оплату: $ и ₽');
    if(!inv.topup_id && !inv.est_usd && !inv.via_broker) return toast('Впиши примерную сумму в $');
    if(inv.via_broker){ inv.paid=true; inv.topup_id=0 }
    const lines=inv.lines.filter(l=>l.name&&numOrNull(l.stems)).map(l=>({name:l.name.trim(),boxes:numOrNull(l.boxes),stems:numOrNull(l.stems),weight_kg:numOrNull(l.weight_kg),price_usd:numOrNull(l.price_usd)||0,mrc:numOrNull(l.mrc)}));
    const {id,_warnings,rub_paid,...body}=inv; body.lines=lines; body.usd_paid=inv.usd_paid;
    const snap=await api('/invoices'+(id?'?inv_id='+id:''),{method:'POST',body});
    if(draft?._draftId) await api('/drafts/'+draft._draftId,{method:'DELETE'});
    if(!inv.topup_id){ toast('Сохранено в «В пути»'); return tab('transit') }
    const moved=inv.topup_id!==t.id;
    toast(moved?'Инвойс перенесён в пополнение '+(TOPS.find(x=>x.id===inv.topup_id)||{}).date:'Инвойс сохранён'); stack.pop();
    const sn=moved?undefined:snap;
    stack[stack.length-1][0]==='topup'?render('topup',{id:t.id,snap:sn}):go('topup',{id:t.id,snap:sn});
  };
  if(inv.id) document.getElementById('del').onclick=async()=>{ if(!confirm('Удалить инвойс?'))return;
    const snap=await api('/invoices/'+inv.id,{method:'DELETE'}); stack.pop(); render('topup',{id:t.id,snap}) };
},

// ======================= LOGISTICS =======================
async logistics({t, lg, draft}){
  lg = lg || {topup_id:t.id,awb:'',leg:'air',provider:'',invoice_no:'',usd:null,rub:null,basis:'auto',paid_date:t.date,note:''};

  if(draft){ const fr=draft.freight||{}; Object.assign(lg,{awb:draft.awb||'',provider:fr.provider||draft.farm||'',leg:fr.leg||'air',usd:fr.total_usd??draft.invoice_total_usd,rub:fr.total_rub,weight_kg:draft.total_weight_kg,
      leg:/flora|флора/i.test(fr.provider||draft.farm||'')?'msk':'air',invoice_no:draft.invoice_no||'',source_file:draft.source_file});
    [...(fr.per_farm_kg||[]),...(draft.per_farm_kg||[])].forEach(x=>farmKg[x.farm]=x.kg); }
  $app.innerHTML=`<h1>${lg.id?'Логистика':'Новая логистика'}</h1>
  <p class="sub">Счёт за фрахт по одному MAWB. Делится на все плантации этого MAWB по весу, внутри плантации — по весу/коробкам/стеблям.</p>

    <div class="two"><div class="field"><label>MAWB</label><input name="awb" value="${esc(lg.awb)}"></div>
    <div class="field"><label>Плечо</label><select name="leg"><option value="air" ${lg.leg==='air'?'selected':''}>Expolanka · Кения → Амстердам</option><option value="msk" ${lg.leg==='msk'?'selected':''}>Floratrack</option></select></div></div>
    <div class="two"><div class="field"><label>Перевозчик</label><input name="provider" list="fwd" value="${esc(lg.provider)}" placeholder="Expolanka / Floratrack"><datalist id="fwd"><option value="Expolanka"><option value="Floratrack"></datalist></div>
    <div class="field"><label>Номер счёта</label><input name="invoice_no" value="${esc(lg.invoice_no||'')}"></div></div>
    <div class="two"><div class="field"><label>Сумма, $</label><input name="usd" inputmode="decimal" value="${lg.usd??''}"></div>
    <div class="field"><label>Сумма, ₽</label><input name="rub" inputmode="decimal" value="${lg.rub??''}"></div></div>
    <div class="field"><label>Вес по счёту, кг (ставка ₽/кг = сумма ₽ / этот вес)</label><input name="weight_kg" inputmode="decimal" value="${lg.weight_kg??''}"></div>
    <div class="field"><label>Оплачено из</label><select name="topup"><option value="${t.id}" ${lg.topup_id===t.id?'selected':''}>этого пополнения (${esc(t.date)})</option><option value="" ${lg.topup_id==null?'selected':''}>не из пополнения</option>${lg.topup_id&&lg.topup_id!==t.id?`<option value="${lg.topup_id}" selected>другого пополнения</option>`:''}</select></div>
    <div class="field"><label>Как делить между плантациями</label><select name="basis">${[['auto','По весу, если он есть у всех'],['kg','По весу'],['stems','По стеблям']].map(([v,n])=>`<option value="${v}" ${lg.basis===v?'selected':''}>${n}</option>`).join('')}</select></div>
    <div class="field"><label>Дата оплаты</label><input name="paid_date" value="${esc(lg.paid_date||'')}"></div>
  </form>
  <h2>Разбивка кг по плантациям (этот MAWB)</h2>
  <p class="hint">По ней делится этот фрахт. Можно внести позже — кинь разбивку боту с MAWB в подписи.</p>
  <div class="group" id="kg"><div class="empty">Впиши MAWB — подтяну плантации.</div></div>
  <div class="actions">${lg.id?'<button id="del" class="x">Удалить</button>':''}<button class="primary" id="save">Сохранить</button></div>`;
  const f=document.getElementById('f'), kg=document.getElementById('kg');
  f.provider.addEventListener('change',()=>{const v=f.provider.value;if(/flora|флора/i.test(v))f.leg.value='msk';else if(/expolanka|экспо/i.test(v))f.leg.value='air'});
  let invs=[];
  const loadAwb=async()=>{ const a=f.awb.value.trim(); if(!a)return;
    const r=await api('/weights/'+encodeURIComponent(a));
    const merged={...r.farm_kg,...farmKg};                 // saved breakdown + whatever came with this document
    const same=(x,y)=>x.toLowerCase().slice(0,4)===y.toLowerCase().slice(0,4);
    const rows=[...Object.keys(merged)];
    r.invoices.forEach(i=>{ if(!rows.some(k=>same(k,i.farm))) rows.push(i.farm) });
    const val=fm=>merged[fm]??r.invoices.find(i=>same(i.farm,fm))?.weight_kg??'';
    const note=fm=>r.invoices.some(i=>same(i.farm,fm))?'':' · инвойса ещё нет';

    const tot=()=>{let x=0;kg.querySelectorAll('input[data-farm]').forEach(i=>x+=numOrNull(i.value)||0);const e=document.getElementById('kgtot');if(e)e.textContent=`Итого ${fmt(x,1)} кг`};

  document.getElementById('save').onclick=async()=>{
    const body={awb:f.awb.value.trim(),leg:f.leg.value,provider:f.provider.value.trim(),invoice_no:f.invoice_no.value.trim(),usd:numOrNull(f.usd.value),rub:numOrNull(f.rub.value),
      weight_kg:numOrNull(f.weight_kg.value),
      topup_id:f.topup.value?+f.topup.value:null,basis:f.basis.value,paid_date:f.paid_date.value,note:lg.note||'',source_file:lg.source_file||null,farm_kg:{}};
    kg.querySelectorAll('[data-farm]').forEach(i=>{const v=numOrNull(i.value);if(v)body.farm_kg[i.dataset.farm]=v});
    if(!body.awb) return toast('Нужен MAWB');
    if(!body.usd&&!body.rub) return toast('Нужна сумма в $ или ₽');
    if(!body.rub) return toast('Впиши сумму в ₽');
    const snap=await api(`/logistics?view_topup=${t.id}`+(lg.id?'&log_id='+lg.id:''),{method:'POST',body});
    if(draft?._draftId) await api('/drafts/'+draft._draftId,{method:'DELETE'});
    toast('Логистика сохранена'); stack.pop(); stack[stack.length-1][0]==='topup'?render('topup',{id:t.id,snap}):go('topup',{id:t.id,snap});
  };
  if(lg.id) document.getElementById('del').onclick=async()=>{ if(!confirm('Удалить?'))return;
    const snap=await api(`/logistics/${lg.id}?view_topup=${t.id}`,{method:'DELETE'}); stack.pop(); render('topup',{id:t.id,snap}) };
},

// ======================= KG BREAKDOWN PER MAWB =======================
async weights({t, awb, draft}){
  let kg = {}, srcFile = null, warns = [];
  if(draft){ awb = draft.awb||''; srcFile = draft.source_file; warns = draft.warnings||[];
    [...(draft.per_farm_kg||[]),...(draft.freight?.per_farm_kg||[])].forEach(x=>kg[x.farm]=x.kg); }
  $app.innerHTML=`<h1>Разбивка кг</h1>
  <p class="sub">Сколько кг каждой плантации в MAWB. По ней делится фрахт перевозчика. HAWB не нужен.</p>
  <div class="drop" id="drop">Загрузить разбивку (PDF / фото) — AI заполнит</div><input type="file" id="file" accept="application/pdf,image/*" hidden>
  <div id="w"></div>
  <form id="f" class="group" style="margin-top:12px"><div class="field"><label>MAWB</label><input name="awb" value="${esc(awb||'')}" placeholder="065-4053 8245"></div></form>
  <h2>Плантации</h2><div class="group" id="list"><div class="empty">Впиши MAWB.</div></div>
  <div class="actions"><button class="ghost" id="addRow">+ плантация, которой ещё нет</button></div>
  <div class="hint num" id="tot" style="margin:0 16px"></div>
  <div class="actions"><button class="primary" id="save">Сохранить разбивку</button></div>`;
  const f=document.getElementById('f'), list=document.getElementById('list');
  const showW=()=>document.getElementById('w').innerHTML=warns.length?`<div class="warn">${warns.map(w=>`<div>${esc(w)}</div>`).join('')}</div>`:'';
  const total=()=>{let x=0;list.querySelectorAll('input[data-farm]').forEach(i=>x+=numOrNull(i.value)||0);document.getElementById('tot').textContent=x?`Итого ${fmt(x,1)} кг`:''};
  const draw=async()=>{
    const a=f.awb.value.trim(); if(!a) return;
    const r=await api('/weights/'+encodeURIComponent(a));
    const merged={...r.farm_kg,...kg};
    const farms=[...new Set([...r.invoices.map(i=>i.farm),...Object.keys(merged)])];
    const val=fm=>{const k=Object.keys(merged).find(k=>k.toLowerCase()===fm.toLowerCase());return k!=null?merged[k]:(r.invoices.find(i=>i.farm===fm)?.weight_kg??'')};
    list.innerHTML=farms.length?farms.map(fm=>`<div class="field"><label>${esc(fm)}${r.invoices.some(i=>i.farm.toLowerCase()===fm.toLowerCase())?'':' · инвойса ещё нет'}</label>
      <input data-farm="${esc(fm)}" inputmode="decimal" value="${val(fm)}"></div>`).join(''):'<div class="empty">На этом MAWB пока ничего. Добавь плантации вручную или загрузи документ.</div>';
    total();
  };
  list.oninput=total; f.awb.onchange=draw; draw(); showW();
  document.getElementById('addRow').onclick=()=>{const n=prompt('Название плантации');if(!n)return;
    if(list.querySelector('.empty'))list.innerHTML='';
    list.insertAdjacentHTML('beforeend',`<div class="field"><label>${esc(n)} · инвойса ещё нет</label><input data-farm="${esc(n)}" inputmode="decimal"></div>`)};
  const drop=document.getElementById('drop'), file=document.getElementById('file');
  drop.onclick=()=>file.click();
  file.onchange=async()=>{ if(!file.files[0])return; drop.classList.add('busy'); drop.textContent='Читаю…';
    try{const fd=new FormData();fd.append('file',file.files[0]);const r=await api('/parse',{method:'POST',body:fd});
      [...(r.per_farm_kg||[]),...(r.freight?.per_farm_kg||[])].forEach(x=>kg[x.farm]=x.kg);
      if(r.awb&&!f.awb.value.trim()) f.awb.value=r.awb; srcFile=r.source_file; warns=r.warnings||[]; showW(); await draw();}
    catch(x){toast(x.message)} drop.classList.remove('busy'); drop.textContent='Загрузить разбивку (PDF / фото) — AI заполнит'};
  document.getElementById('save').onclick=async()=>{
    const body={awb:f.awb.value.trim(),farm_kg:{},source_file:srcFile};
    list.querySelectorAll('input[data-farm]').forEach(i=>{const v=numOrNull(i.value);if(v)body.farm_kg[i.dataset.farm]=v});
    if(!body.awb) return toast('Нужен MAWB');
    if(!Object.keys(body.farm_kg).length) return toast('Впиши кг хотя бы для одной плантации');
    await api('/weights',{method:'POST',body});
    if(draft?._draftId) await api('/drafts/'+draft._draftId,{method:'DELETE'});
    toast('Разбивка сохранена'); stack.pop(); if(!t) return render('home',{});
    stack[stack.length-1]?.[0]==='topup'?render('topup',{id:t.id}):go('topup',{id:t.id});
  };
},

// ======================= DRAFT -> pick top-up =======================
async draft({d,tops}){
  $app.innerHTML=`<h1>${esc(d.farm||d.freight?.provider||'Черновик')}</h1>
  <p class="sub">${d.doc_type==='farm_invoice'?'Инвойс плантации':d.doc_type==='kg_breakdown'?'Разбивка кг по плантациям':'Счёт за логистику'} · MAWB ${esc(d.awb||'?')}. Из какого пополнения оплачен?</p>
  ${d.warnings?.length?`<div class="warn">${d.warnings.map(w=>`<div>${esc(w)}</div>`).join('')}</div>`:''}
  <div class="group" style="margin-top:12px">${tops.map(t=>`<div class="row" data-t="${t.id}"><div class="grow"><div class="t">${esc(t.date)}</div><div class="s num">$${fmt(t.usd,2)}</div></div></div>`).join('')||'<div class="empty">Сначала создай пополнение.</div>'}</div>
  <div class="actions"><button class="x" id="drop">Выбросить черновик</button></div>`;
  $app.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{const t=tops.find(x=>x.id==e.dataset.t); d._draftId=d.id;
    stack.pop(); go(d.doc_type==='farm_invoice'?'invoice':d.doc_type==='kg_breakdown'?'weights':'logistics',{t,draft:d})});
  document.getElementById('drop').onclick=async()=>{await api('/drafts/'+d.id,{method:'DELETE'});back()};
},

// ======================= В ПУТИ =======================
async transit({seg,q}={}){
  const Q = (q!==undefined ? q : (window.TRANSIT_Q||'')).trim();
  window.TRANSIT_Q = Q;
  const v=await api('/transit'+(Q?'?q='+encodeURIComponent(Q):''));
  const SEG = seg || window.TRANSIT_SEG || 'unpaid';
  window.TRANSIT_SEG = SEG;
  const nUn=v.invoices.filter(i=>i.paid_state!=='paid').length, nPd=v.invoices.length-nUn;
  const shown=Q ? v.invoices : v.invoices.filter(i=>SEG==='paid'?i.paid_state==='paid':i.paid_state!=='paid');
  const by={}; shown.forEach(i=>(by[i.awb||'без MAWB']??=[]).push(i));
  const eta=i=>i.eta?`прибытие ${i.eta.slice(8,10)}.${i.eta.slice(5,7)} ${i.eta.slice(11,16)}`:'';

async stock(){
  const v=await api('/stock');
  const sum=l=>l.reduce((a,i)=>a+(i.rub_goods||0),0);
  const byAwb=l=>{const m={}; l.forEach(i=>(m[i.awb||'без MAWB']??=[]).push(i)); return Object.entries(m)};
  const rows=(l,showPaid)=>l.map(i=>`<div class="row" data-ti="${i.id}"><div class="grow"><div class="t">${esc(i.farm)}</div>
      <div class="s">MAWB ${esc(i.awb||'?')} · ${fmt(i.stems)} ст${showPaid?' · '+(i.paid?'оплачен':'<b>не оплачен</b>'):''}</div></div>
      <div class="v"><div class="num">${i.approx?'≈ ':''}${fmt(i.rub_goods)} ₽</div></div></div>`).join('');
  const head=(title,l,hint)=>`<h2>${title}</h2><div class="group"><div class="row"><div class="grow">
      <div class="big num">${l.some(i=>i.approx)?'≈ ':''}${fmt(sum(l))} ₽</div><div class="s">${hint} · ${l.length} инв.</div></div></div>`;
  const wh=byAwb(v.warehouse).map(([awb,l])=>`<div class="row"><div class="grow"><div class="t">MAWB ${esc(awb)}</div>
      <div class="s">${esc([...new Set(l.map(i=>i.farm))].join(', '))} · ${fmt(sum(l))} ₽</div></div>
      ${ME.can_write?`<div class="v"><button class="primary" data-pk="${esc(awb)}">Забрал</button></div>`:''}</div>${rows(l,true)}`).join('');
  $app.innerHTML=`<h1>Товарные остатки</h1>
  <p class="sub">Только товар (цветы), без ТК. ${ME.can_write?`Неоплаченные — ≈ по курсу ${fmt(v.est_rate,2)} (пополнение ${esc(v.est_topup||'—')}).`:''}</p>
  ${head('🚚 Груз в пути',v.in_transit,'ещё не прибыл — всего')}
    ${[['🟢 Оплачено',v.in_transit.filter(i=>i.paid)],['🟠 Не оплачено',v.in_transit.filter(i=>!i.paid)]].filter(([,l])=>l.length).map(([t,l])=>
      `<div class="row" style="background:var(--bg2,rgba(127,127,127,.08))"><div class="grow"><div class="t">${t}</div><div class="s">${l.length} инв.</div></div>
       <div class="v"><div class="num"><b>${l.some(i=>i.approx)?'≈ ':''}${fmt(sum(l))} ₽</b></div></div></div>${rows(l,false)}`).join('')}</div>
  ${v.warehouse.length?`${head('🏬 Прибыл — на складе ТК',v.warehouse,'нажми «Забрал», когда заберёте — уйдёт из остатков')}${wh}</div>`:''}
  ${head('💳 Не оплачено',v.unpaid,'деньги, которые ещё должны фермам — уходит после оплаты')}${rows(v.unpaid,false)}</div>`;
  $app.querySelectorAll('[data-pk]').forEach(b=>b.onclick=async e=>{ e.stopPropagation();
    if(!confirm('Груз MAWB '+b.dataset.pk+' забран со склада ТК?'))return;
    await api('/stock/picked/'+encodeURIComponent(b.dataset.pk),{method:'POST'}); toast('Убрал из остатков'); render('stock') });
  $app.querySelectorAll('[data-ti]').forEach(e=>e.onclick=async()=>{ const t=await api('/transit');
    const i=t.invoices.find(x=>x.id==e.dataset.ti); if(i) go('transitInv',{i,v:t}); else toast('Подробности — в «Откупах»') });
},

// «Оплачен»: which top-up + $ (₽ by that top-up's rate unless typed)
async function payForm({kind,id,usd}){
  const tops=await api('/topups');
  const wrap=document.createElement('div');
  wrap.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end';
  wrap.innerHTML=`<div style="background:var(--bg2);width:100%;border-radius:18px 18px 0 0;padding:14px 0 calc(16px + env(safe-area-inset-bottom,0))">
    <h2 style="margin-top:4px">Из какого пополнения оплачен?</h2>
    <div class="group">${tops.slice(0,8).map((t,n)=>`<label class="row"><input type="radio" name="tp" value="${t.id}" ${n?'':'checked'}><div class="grow"><div class="t">${esc(t.date)}</div><div class="s num">курс ${fmt(t.rate,2)}</div></div></label>`).join('')}</div>
    <form class="group" style="margin-top:10px"><div class="two"><div class="field"><label>Оплачено, $</label><input name="usd" inputmode="decimal" value="${usd??''}"></div>
    <div class="field"><label>₽ (пусто = по курсу)</label><input name="rub" inputmode="decimal"></div></div>
    ${kind==='invoices'?'<div class="field"><label>Дошло до фермы, $ (пусто = ровно по инвойсу)</label><input name="farm" inputmode="decimal"></div>':''}</form>
    <div class="actions"><button id="pcancel">Отмена</button><button class="primary" id="pok">Оплачен</button></div></div>`;
  document.body.appendChild(wrap);
  const close=()=>wrap.remove();
  wrap.querySelector('#pcancel').onclick=close;
  wrap.querySelector('#pok').onclick=async()=>{
    const f=wrap.querySelector('form'); const tp=+wrap.querySelector('input[name=tp]:checked')?.value;
    const body={topup_id:tp,usd:numOrNull(f.usd.value),rub:numOrNull(f.rub.value),farm_usd:f.farm?numOrNull(f.farm.value):null};
    if(!tp) return toast('Выбери пополнение'); if(kind==='invoices'&&!body.usd) return toast('Впиши $');
    try{ await api(`/${kind}/${id}/pay`,{method:'POST',body}); close(); toast('Оплачено — себестоимость теперь точная'); tab('transit') }catch(e){toast(e.message)}
  };
}

// "Excel в чат": for whom (me / operator) and which (this top-up / all) — native Telegram popups
function popup(title, message, buttons){
  return new Promise(res=>{
    if(tg?.showPopup && tg.isVersionAtLeast?.('6.2')) tg.showPopup({title,message,buttons:[...buttons,{type:'cancel'}]},id=>res(id||null));
    else { const n=prompt(message+'\n'+buttons.map((b,i)=>`${i+1} — ${b.text}`).join('\n'),'1'); res(buttons[+n-1]?.id||null) }
  });
}
async function askExport(date){
  let audience='operator';
  if(ME?.can_write){
    audience = await popup('Excel в чат','Для кого выгрузка?',[{id:'owner',type:'default',text:'Для меня'},{id:'operator',type:'default',text:'Для оператора'}]);
    if(!audience) return null;
  }
  const scope = await popup('Excel в чат','Какие пополнения?',[{id:'one',type:'default',text:`Только ${date.slice(0,5)}`},{id:'all',type:'default',text:'Все'}]);
  return scope ? {scope, audience} : null;
}

function applyParsed(inv, r){
  Object.assign(inv,{farm:r.farm||inv.farm,country:r.country||inv.country,invoice_no:r.invoice_no||inv.invoice_no,
    invoice_date:r.invoice_date||inv.invoice_date,awb:r.awb||inv.awb,invoice_total_usd:r.invoice_total_usd??inv.invoice_total_usd,
    weight_kg:r.weight_kg??inv.weight_kg,
    source_file:r.source_file,_warnings:[...(r.mawb_note?[r.mawb_note]:[]),...(r.warnings||[])]});
  if(r.lines?.length) inv.lines=r.lines.map(l=>({name:l.name,boxes:l.boxes,stems:l.stems,weight_kg:l.weight_kg,price_usd:l.price_usd}));
  if(!inv.usd_paid && r.invoice_total_usd) inv._warnings.push('Суммы оплаты $ и ₽ впиши сам — из инвойса не подставляю.');
}
