<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Учёт Люмен</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff); --bg2:var(--tg-theme-secondary-bg-color,#f3f1f2);
  --fg:var(--tg-theme-text-color,#1c1a1b); --muted:var(--tg-theme-hint-color,#8a8387);
  --rose:#b4436c; --rose-soft:color-mix(in srgb,var(--rose) 12%,transparent);
  --ok:#2f7d57; --warn:#b7791f; --err:#c0392b;
  --line:color-mix(in srgb,var(--fg) 10%,transparent);
  --r:14px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg2);color:var(--fg);font-size:15px;line-height:1.4}
body{padding:env(safe-area-inset-top,0) 0 calc(env(safe-area-inset-bottom,0) + 110px)}
.num{font-variant-numeric:tabular-nums}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:30px;line-height:1.1;margin:18px 16px 4px}
h2{font-size:13px;font-weight:600;color:var(--muted);margin:22px 16px 8px}
.sub{color:var(--muted);margin:0 16px 12px;font-size:13px}
.group{background:var(--bg);margin:0 12px;border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--muted)}
.row .v{text-align:right;font-variant-numeric:tabular-nums}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--rose-soft);color:var(--rose);white-space:nowrap}
/* the one bold thing: the money flow of a top-up */
.flow{margin:6px 12px 0;background:var(--rose);color:#fff;border-radius:18px;padding:16px;display:grid;grid-template-columns:1fr auto 1fr;gap:4px 10px;align-items:end}
.flow .big{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;font-weight:600;line-height:1}
.flow .lbl{font-size:12px;opacity:.8}
.flow .arrow{font-size:20px;opacity:.7;align-self:center}
.flow .foot{grid-column:1/-1;display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.25);margin-top:10px;padding-top:10px;font-size:13px}
.actions{display:flex;gap:8px;margin:12px}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;background:var(--bg);color:var(--fg);cursor:pointer;font-weight:600}
button.primary{background:var(--rose);color:#fff}
button.ghost{background:transparent;color:var(--rose);padding:8px}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.actions button{flex:1}
.warn{margin:10px 12px 0;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--warn) 14%,var(--bg));font-size:13px}
.warn div+div{margin-top:4px}
.issue{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.issue b{display:block}
.issue.error b{color:var(--err)} .issue.warning b{color:var(--warn)}
.issue .fix{color:var(--muted);font-size:13px;margin-top:2px}
form{margin:0}
.field{display:flex;flex-direction:column;padding:8px 14px;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{border:0;background:transparent;color:var(--fg);font:inherit;padding:4px 0;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr}
.two .field:first-child{border-right:1px solid var(--line)}
.lines{width:100%;border-collapse:collapse;font-size:13px}
.lines th{font-weight:500;color:var(--muted);text-align:left;padding:6px 4px}
.lines td{padding:2px 2px;border-top:1px solid var(--line)}
.lines input{width:100%;border:0;background:transparent;color:var(--fg);font:inherit;padding:8px 4px;font-variant-numeric:tabular-nums}
.lines td.calc{color:var(--muted);text-align:right;padding-right:6px;white-space:nowrap}
.scroll{overflow-x:auto}
.drop{margin:0 12px;border:1.5px dashed var(--rose);border-radius:var(--r);padding:16px;text-align:center;color:var(--rose);background:var(--bg);cursor:pointer}
.drop.busy{opacity:.6;pointer-events:none}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:6px 16px 0}
.x{color:var(--err);background:none;padding:4px 8px}
.ro #farms,.ro #save,.ro #del,.ro .x,.ro .drop,.ro #addLine,.ro #new,.ro #addInv,.ro #addLog,.ro #addRow,.ro #edit,.ro #delTop,.ro #act,.ro #audit,.ro #drafts{display:none!important}
.ro input,.ro select,.ro textarea{pointer-events:none;opacity:.85}
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0));z-index:10}
.tabbar button{flex:1;background:none;border-radius:10px;padding:6px 2px;font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tabbar button .i{font-size:20px;line-height:1}
.tabbar button.on{color:var(--rose)}
.big{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;font-weight:600;line-height:1.1}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar"></nav>
<div id="toast"></div>
<script>
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const $app = document.getElementById('app');
const fmt = (n, d=0) => n==null||n==='' ? '—' : Number(n).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d});
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const numOrNull = v => v===''||v==null ? null : Number(String(v).replace(',','.').replace(/\s/g,''));
const today = () => new Date().toLocaleDateString('ru-RU');
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2600)}

async function api(path, opt={}){
  const headers = {'X-Init-Data': tg?.initData||''};
  if (opt.body && !(opt.body instanceof FormData)){headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}
  const r = await fetch('/api'+path,{...opt,headers});
  if(!r.ok){const t=await r.text();throw new Error(t.slice(0,200))}
  return r.json();
}

// ---------- tiny router with Telegram back button ----------
const stack=[];
function go(view, args={}, push=true){ if(push) stack.push([view,args]); render(view,args) }
function back(){ stack.pop(); const [v,a]=stack[stack.length-1]||['home',{}]; render(v,a) }
tg?.BackButton.onClick(back);
const TABS=[['home','💐','Откупы'],['transit','🚚','В пути'],['stock','📦','Остатки'],['more','⋯','Ещё']];
const TAB_OF={home:'home',topup:'home',topupForm:'home',draft:'home',invoice:null,logistics:null,weights:'home',
  transit:'transit',transitInv:'transit',stock:'stock',more:'more',farms:'more',farm:'more',users:'more'};
let CUR_TAB='home';
function tab(v){ stack.length=0; go(v) }
function drawTabs(){
  const tabs=TABS.filter(([v])=>v!=='more'||ME?.can_write);
  document.getElementById('tabbar').innerHTML=tabs.map(([v,i,t])=>`<button class="${CUR_TAB===v?'on':''}" data-tab="${v}"><span class="i">${i}</span>${t}</button>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
}
async function render(view,args){
  if(TAB_OF[view]) CUR_TAB=TAB_OF[view];
  stack.length>1 ? tg?.BackButton.show() : tg?.BackButton.hide();
  window.scrollTo(0,0);
  try{ await whoami(); drawTabs(); await VIEWS[view](args) }catch(e){ $app.innerHTML=`<div class="empty">Не загрузилось: ${esc(e.message)}</div>` }
}

let FARMS=[], ME=null, MONEY={}, MARK=null;
async function whoami(){ if(!ME){ ME=await api('/me'); document.body.classList.toggle('ro',!ME.can_write);
    try{ MARK=(await api('/settings/marking')).marking }catch(e){} }
  if(ME.sees_money){ try{MONEY=await api('/money')}catch(e){} } }
const VIEWS = {

// ======================= HOME =======================
async home(){
  await whoami();
  const [tops, drafts] = await Promise.all([api('/topups'), ME.can_write?api('/drafts'):Promise.resolve([])]);
  FARMS = FARMS.length ? FARMS : await api('/farms');
  $app.innerHTML = `
    <h1>Учёт поставок</h1>
    <p class="sub">Пополнение → инвойсы плантаций → логистика → Excel</p>
    ${drafts.length?`<h2 id="drafts">Черновики из чата</h2><div class="group">${drafts.map(d=>`
      <div class="row" data-draft="${d.id}"><div class="grow"><div class="t">${esc(d.doc_type==='kg_breakdown'?'Разбивка кг':d.doc_type==='freight_invoice'?'Фрахт · '+(d.freight?.provider||d.farm||''):(d.farm||'Документ'))}</div>
      <div class="s">MAWB ${esc(d.awb||'?')} · ${d.doc_type==='kg_breakdown'?fmt((d.per_farm_kg||[]).reduce((a,x)=>a+(x.kg||0),0))+' кг':d.doc_type==='freight_invoice'?(d.freight?.total_usd?'$'+fmt(d.freight.total_usd,2):d.freight?.total_rub?fmt(d.freight.total_rub)+' ₽':'сумма?')+(d.kg_total?' · разбивка '+fmt(d.kg_total)+' кг ✓':' · разбивки кг нет'):fmt((d.lines||[]).reduce((a,l)=>a+(l.stems||0),0))+' стеблей · $'+fmt(d.invoice_total_usd,2)}</div></div>
      <span class="pill">разобрать</span><button class="x" data-dd="${d.id}" title="Удалить черновик">×</button></div>`).join('')}</div>
    <div class="actions" style="margin-top:6px"><button class="ghost" id="clearDrafts">Удалить все черновики</button></div>`:''}
    <h2>Пополнения</h2>
    <div class="group">${tops.length?tops.map(t=>`
      <div class="row" data-top="${t.id}"><div class="grow"><div class="t">${esc(t.date)}${t.active?' <span class="pill">сюда идут документы</span>':''}</div>
      <div class="s num">${fmt(t.rub)} ₽ → $${fmt(t.usd)} · курс ${fmt(t.rate,4)}</div></div>
      ${ME.sees_money&&MONEY[t.id]?`<div class="v"><div class="num">$${fmt(MONEY[t.id].usd_left,2)}</div><div class="s">остаток</div></div>`:''}</div>`).join('')
      :'<div class="empty">Пополнений пока нет. Начни с первого.</div>'}</div>
    <div class="actions"><button class="primary" id="new">Новое пополнение</button></div>
`;
  $app.querySelectorAll('[data-top]').forEach(e=>e.onclick=()=>go('topup',{id:+e.dataset.top}));
  $app.querySelectorAll('[data-dd]').forEach(b=>b.onclick=async ev=>{ev.stopPropagation();
    await api('/drafts/'+b.dataset.dd,{method:'DELETE'}); toast('Черновик удалён'); render('home',{})});
  document.getElementById('clearDrafts')?.addEventListener('click',async()=>{ if(!confirm(`Удалить все черновики (${drafts.length})?`))return;
    await api('/drafts',{method:'DELETE'}); toast('Черновики удалены'); render('home',{})});
  $app.querySelectorAll('[data-draft]').forEach(e=>e.onclick=()=>{const d=drafts.find(x=>x.id===e.dataset.draft);
    if(d.doc_type==='kg_breakdown'){d._draftId=d.id;return go('weights',{t:null,draft:d})}   // weights don't belong to a top-up
    const tt=d.topup_id&&tops.find(x=>x.id===d.topup_id);
    if(tt){d._draftId=d.id;return go(d.doc_type==='farm_invoice'?'invoice':'logistics',{t:tt,draft:d})}
    go('draft',{d,tops})});
  document.getElementById('new').onclick=()=>go('topupForm',{});
  document.getElementById('farms')?.addEventListener('click',()=>go('farms'));
  document.getElementById('users')?.addEventListener('click',()=>go('users'));
},

// ======================= TOP-UP FORM =======================
async topupForm({t}){
  t = t||{date:today(),rub:'',usd:'',prev_balance_rub:'',note:''};
  $app.innerHTML=`<h1>${t.id?'Пополнение '+esc(t.date):'Новое пополнение'}</h1>
  <p class="sub">Сколько ₽ отправили и сколько $ реально зачислил агент — отсюда курс для всех оплат.</p>
  <form id="f" class="group">
    <div class="field"><label>Дата</label><input name="date" value="${esc(t.date)}" placeholder="23.09.2026"></div>
    <div class="two"><div class="field"><label>Отправили, ₽</label><input name="rub" inputmode="decimal" value="${t.rub??''}"></div>
    <div class="field"><label>Зачислено, $</label><input name="usd" inputmode="decimal" value="${t.usd??''}"></div></div>
    <div class="field"><label>Курс</label><div id="rate" class="num">—</div></div>
    <div class="field"><label>Предыдущий остаток, ₽ (если есть)</label><input name="prev_balance_rub" inputmode="decimal" value="${t.prev_balance_rub??''}"></div>
    <div class="field"><label>Заметка</label><input name="note" value="${esc(t.note||'')}"></div>
  </form>
  <div class="actions"><button class="primary" id="save">Сохранить</button></div>`;
  const f=document.getElementById('f');
  const upd=()=>{const r=numOrNull(f.rub.value),u=numOrNull(f.usd.value);document.getElementById('rate').textContent=r&&u?fmt(r/u,4)+' ₽/$':'—'};
  f.oninput=upd; upd();
  document.getElementById('save').onclick=async()=>{
    const body={date:f.date.value.trim(),rub:numOrNull(f.rub.value),usd:numOrNull(f.usd.value),prev_balance_rub:numOrNull(f.prev_balance_rub.value),note:f.note.value};
    if(!body.rub||!body.usd) return toast('Нужны обе суммы: ₽ и $');
    const r = t.id ? await api('/topups/'+t.id,{method:'PUT',body}) : await api('/topups',{method:'POST',body});
    stack.pop(); t.id ? back() : go('topup',{id:r.id});
  };
},

// ======================= TOP-UP DETAIL =======================
async topup({id, snap}){
  await whoami();
  const d = snap || await api('/topups/'+id); const t=d.topup;
  const byAwb={}; d.invoices.forEach(i=>(byAwb[i.awb||'без MAWB']??=[]).push(i));
  $app.innerHTML=`
  <h1>Пополнение ${esc(t.date)}</h1>
  <div class="flow num">
    <div><div class="lbl">Отправили</div><div class="big">${fmt(t.rub)} ₽</div></div>
    <div class="arrow">→</div>
    <div><div class="lbl">Зачислено</div><div class="big">$${fmt(t.usd)}</div></div>
    <div class="foot"><span>Курс ${fmt(t.rate,4)}</span>${ME.sees_money&&MONEY[t.id]?`<span>Потрачено $${fmt(MONEY[t.id].usd_spent,2)}</span><span>Остаток $${fmt(MONEY[t.id].usd_left,2)}</span>`:''}</div>
  </div>
  <div class="actions"><button id="audit">AI-проверка</button><button class="primary" id="xls">Excel в чат</button></div>
  <div id="auditbox"></div>
  ${d.warnings.length?`<div class="warn">${d.warnings.map(w=>`<div>${esc(w)}</div>`).join('')}</div>`:''}
  <h2>Инвойсы плантаций</h2>
  <div class="group">${d.invoices.length?Object.entries(byAwb).map(([awb,invs])=>invs.map(i=>{
      const st=i.lines.reduce((a,l)=>a+l.stems,0), cost=i.lines.reduce((a,l)=>a+l.total_rub*l.stems,0);
      return `<div class="row" data-inv="${i.id}"><div class="grow"><div class="t">${esc(i.farm)}</div>
      <div class="s">${esc(i.country)} · MAWB ${esc(awb)} · ${fmt(st)} ст.${i.weight_kg?' · '+fmt(i.weight_kg,1)+' кг':''}</div></div>
      <div class="v"><div>$${fmt(i.usd_paid,2)}</div><div class="s">${st?fmt(cost/st,2)+' ₽/ст':''}</div></div></div>`}).join('')).join('')
    :'<div class="empty">Добавь первый инвойс — загрузи PDF или фото, AI заполнит строки.</div>'}</div>
  <div class="actions"><button id="addInv">Добавить инвойс</button></div>
  <h2>Логистика по MAWB этого пополнения</h2>
  <div class="group">${d.logistics.length?d.logistics.map(l=>`
    <div class="row" data-log="${l.id}"><div class="grow"><div class="t">${esc(l.provider||'Фрахт')} · ${l.leg==='air'?'Кения → Амстердам':'Floratrack'}${l.rub_per_kg?' · '+fmt(l.rub_per_kg,2)+' ₽/кг':''}</div>
    <div class="s">MAWB ${esc(l.awb)} · ${l.kg_total?fmt(l.kg_total)+' кг ✓':'<span style="color:var(--warn)">нет разбивки кг</span>'}${l.provisional?' · <span style="color:var(--warn)">курс предварительный</span>':''}${l.topup_id!==t.id?' · оплачено не отсюда':''}${(l.goods_topups||[]).some(d=>d!==t.date)?' · товар из '+l.goods_topups.filter(d=>d!==t.date).join(', '):''}</div></div>
    <div class="v">${l.usd?'$'+fmt(l.usd,2):''}${l.rub?'<div class="s">'+fmt(l.rub)+' ₽</div>':''}</div></div>`).join('')
    :'<div class="empty">Фрахт ещё не внесён — себестоимость пока без логистики.</div>'}</div>
  <div class="actions"><button id="addLog">Добавить логистику</button></div>
  <div class="actions"><button id="edit">Изменить пополнение</button>${t.active?'':'<button id="act">Документы из чата — сюда</button>'}</div>
  <div class="actions"><button class="x" id="delTop">Удалить пополнение</button></div>`;
  $app.querySelectorAll('[data-inv]').forEach(e=>e.onclick=()=>go('invoice',{t,inv:d.invoices.find(i=>i.id==e.dataset.inv)}));
  $app.querySelectorAll('[data-log]').forEach(e=>e.onclick=()=>go('logistics',{t,lg:d.logistics.find(l=>l.id==e.dataset.log)}));
  document.getElementById('addInv').onclick=()=>go('invoice',{t});
  document.getElementById('addLog').onclick=()=>go('logistics',{t});
  document.getElementById('edit').onclick=()=>go('topupForm',{t});
  document.getElementById('delTop').onclick=async()=>{
    const n=d.invoices.length, k=d.logistics.filter(l=>l.topup_id===t.id).length;
    if(!confirm(`Удалить пополнение ${t.date}`+(n||k?` вместе с ${n} инвойсами и ${k} логистикой?`:'?')))return;
    await api('/topups/'+t.id,{method:'DELETE'}); toast('Пополнение удалено'); stack.length=0; go('home');};
  document.getElementById('act')?.addEventListener('click',async()=>{await api(`/topups/${t.id}/activate`,{method:'POST'});toast('Теперь документы из чата идут в '+t.date);render('topup',{id:t.id})});

  document.getElementById('xls').onclick=async e=>{
    const choice = await askExport(t.date);
    if(!choice) return;
    const b=e.target; b.disabled=true; b.textContent='Собираю…';
    try{
      if(choice==='all'){ const r=await api('/export_all',{method:'POST'}); toast(`Все пополнения (${r.sheets.length}) отправлены в чат`) }
      else { const r=await api(`/topups/${t.id}/export`,{method:'POST'}); toast(`Лист «${r.sheet}» отправлен в чат`) }
    }catch(x){toast(x.message)}
    b.disabled=false; b.textContent='Excel в чат'};
  document.getElementById('audit').onclick=async e=>{
    e.target.disabled=true; e.target.textContent='Проверяю…';
    try{const a=await api(`/topups/${t.id}/audit`,{method:'POST'});
      document.getElementById('auditbox').innerHTML=`<h2>AI-проверка</h2><div class="group"><div class="issue"><b>${esc(a.summary)}</b></div>${a.issues.map(i=>`<div class="issue ${i.severity}"><b>${esc(i.where)}: ${esc(i.problem)}</b><div class="fix">${esc(i.fix)}</div></div>`).join('')}</div>`;
    }catch(x){toast(x.message)} e.target.disabled=false; e.target.textContent='AI-проверка';
  };
},

// ======================= INVOICE =======================
async invoice({t, inv, draft}){
  const TOPS = await api('/topups');
  if(!t.id){ t={...t, rate:(TOPS[0]||{}).rate||0, date:t.date||'в пути'} }        // unpaid: ≈ at the last top-up rate
  inv = inv || {topup_id:t.id,country:'',client_code:'',invoice_no:'',invoice_date:'',awb:'',farm:'',weight_kg:null,
    invoice_total_usd:null,usd_paid:'',rub_paid_override:null,alloc_mode:'value',paid:true,paid_date:t.id?t.date:'',note:'',lines:[]};
  if(draft) applyParsed(inv, draft);
  if(!inv.lines.length) inv.lines=[{name:'',boxes:null,stems:'',weight_kg:null,price_usd:''}];
  const farmOpts = FARMS.filter(f=>!f.is_forwarder).map(f=>`<option value="${esc(f.name)}">`).join('');
  $app.innerHTML=`<h1>${inv.id?esc(inv.farm):'Инвойс плантации'}</h1>
  <p class="sub">Строки — как в инвойсе. Суммы оплаты — как реально списал агент.</p>
  <div class="drop" id="drop">Загрузить PDF или фото инвойса — AI заполнит</div><input type="file" id="file" accept="application/pdf,image/*" hidden>
  <div id="aiwarn"></div>
  <h2>Шапка</h2>
  <form id="f" class="group">
    <div class="two"><div class="field"><label>Плантация</label><input name="farm" list="farms" value="${esc(inv.farm)}"><datalist id="farms">${farmOpts}</datalist></div>
    <div class="field"><label>Страна</label><select name="country">${['','Кения','Эквадор','Колумбия'].map(c=>`<option ${c===inv.country?'selected':''}>${c}</option>`).join('')}</select></div></div>
    <div class="two"><div class="field"><label>Номер инвойса</label><input name="invoice_no" value="${esc(inv.invoice_no)}"></div>
    <div class="field"><label>Дата инвойса</label><input name="invoice_date" value="${esc(inv.invoice_date)}"></div></div>
    <div class="two"><div class="field"><label>MAWB</label><input name="awb" value="${esc(inv.awb)}"></div>
    <div class="field"><label>Вес плантации в MAWB, кг</label><input name="weight_kg" inputmode="decimal" value="${inv.weight_kg??''}"></div></div>
    <div class="two"><div class="field"><label>Маркировка</label><input name="client_code" value="${esc(inv.client_code)}" placeholder="${esc(MARK||'LUMEN')}"></div>
    <div class="field"><label>Пополнение</label><select name="topup"><option value="0" ${!(inv.topup_id??t.id)?'selected':''}>🚚 не оплачен — в пути</option>${TOPS.map(x=>`<option value="${x.id}" ${x.id===(inv.topup_id??t.id)?'selected':''}>${esc(x.date)} · $${fmt(x.usd,0)}</option>`).join('')}</select></div></div>
  </form>
  <h2>Номенклатура</h2>
  <div class="group scroll"><table class="lines"><thead><tr><th style="min-width:170px">Название</th><th>Кор.</th><th>Стебли</th><th>Кг</th><th>$ / ст</th><th>₽ / ст</th><th></th></tr></thead>
  <tbody id="lines"></tbody></table></div>
  <div class="actions"><button class="ghost" id="addLine">+ строка</button><span class="hint num" id="sumLines" style="align-self:center"></span></div>
  <h2>Оплата</h2>
  <form id="p" class="group">
    <div class="two"><div class="field"><label>Итог по инвойсу, $ (для справки)</label><input name="invoice_total_usd" inputmode="decimal" value="${inv.invoice_total_usd??''}"></div>
    <div class="field"><label id="usdLbl">Оплачено, $</label><input name="usd_paid" inputmode="decimal" value="${inv.usd_paid??''}"></div></div>
    <div class="field"><label>Оплачено, ₽ <span id="rubMode" class="pill" style="margin-left:6px"></span></label><input name="rub_paid_override" inputmode="decimal" value="${inv.rub_paid_override??''}"></div>
    <div class="hint" style="padding:0 14px 8px">Цена стебля в ₽ = цена $ × (₽ / $ оплаты). Налог и сборы в стебель не идут.</div>
    <div class="field"><label>Как делить ₽ по строкам</label><select name="alloc_mode">
      <option value="value" ${inv.alloc_mode==='value'?'selected':''}>По стоимости строк (разные цены)</option>
      <option value="stems" ${inv.alloc_mode==='stems'?'selected':''}>Поровну на стебель (одна цена)</option></select></div>
    <div class="two"><div class="field"><label>Оплачено</label><select name="paid"><option value="1" ${inv.paid?'selected':''}>да</option><option value="0" ${!inv.paid?'selected':''}>нет</option></select></div>
    <div class="field"><label>Дата оплаты</label><input name="paid_date" value="${esc(inv.paid_date)}"></div></div>
    <div class="field"><label>Комментарий</label><input name="note" value="${esc(inv.note)}"></div>
  </form>
  <div class="actions">${inv.id?'<button id="del" class="x">Удалить</button>':''}<button class="primary" id="save">Сохранить</button></div>`;

  const tb=document.getElementById('lines'), f=document.getElementById('f'), p=document.getElementById('p');
  const drawLines=()=>{tb.innerHTML=inv.lines.map((l,i)=>`<tr data-i="${i}">
    <td><input data-k="name" value="${esc(l.name)}"></td><td><input data-k="boxes" inputmode="decimal" size="3" value="${l.boxes??''}"></td>
    <td><input data-k="stems" inputmode="numeric" size="5" value="${l.stems??''}"></td><td><input data-k="weight_kg" inputmode="decimal" size="3" value="${l.weight_kg??''}"></td>
    <td><input data-k="price_usd" inputmode="decimal" size="4" value="${l.price_usd??''}"></td>
    <td class="calc" data-c="${i}"></td><td><button class="x" data-rm="${i}">×</button></td></tr>`).join(''); sums()};
  // ---- live money: $ → ₽ by the top-up rate, ₽/stem recalculated on every keystroke ----
  const rateNow=()=>(TOPS.find(x=>x.id===+f.topup.value)||t).rate||t.rate;
  let rubAuto = inv.rub_paid_override==null || inv.usd_paid==='' ||
                Math.abs(inv.rub_paid_override - Math.round((inv.usd_paid||0)*rateNow()))<=1;
  const showMode=()=>{const m=document.getElementById('rubMode');
    m.innerHTML=rubAuto?`авто · $ × ${fmt(rateNow(),2)}`:'вручную · <u style="cursor:pointer">по курсу</u>';
    m.onclick=rubAuto?null:()=>{rubAuto=true;syncRub();sums()}};
  const syncRub=()=>{ if(!rubAuto) return; const u=numOrNull(p.usd_paid.value);
    p.rub_paid_override.value = u ? Math.round(u*rateNow()) : '' };
  const sums=()=>{
    const st=inv.lines.reduce((a,l)=>a+(numOrNull(l.stems)||0),0);
    const val=inv.lines.reduce((a,l)=>a+(numOrNull(l.stems)||0)*(numOrNull(l.price_usd)||0),0);
    document.getElementById('sumLines').textContent=`${fmt(st)} стеблей · строки $${fmt(val,2)}`;
    const usd=numOrNull(p.usd_paid.value), rub=numOrNull(p.rub_paid_override.value);
    const perStem=p.alloc_mode.value==='stems';
    inv.lines.forEach((l,i)=>{const c=tb.querySelector(`[data-c="${i}"]`); if(!c) return;
      const flower = !rub ? null : perStem ? (st? rub/st : null) : (usd ? (numOrNull(l.price_usd)||0)*rub/usd : null);
      const logi=(l.air_rub||0)+(l.msk_rub||0);
      c.textContent = flower==null ? '' : fmt(flower+logi,2);
      c.title = logi ? `цветок ${fmt(flower||0,2)} + логистика ${fmt(logi,2)}` : '';
    });
    showMode();
  };
  tb.oninput=e=>{const tr=e.target.closest('tr'),k=e.target.dataset.k;inv.lines[tr.dataset.i][k]=e.target.value;sums()};
  tb.onclick=e=>{if(e.target.dataset.rm!=null){inv.lines.splice(+e.target.dataset.rm,1);drawLines()}};
  p.oninput=e=>{
    if(e.target.name==='usd_paid'){ rubAuto=true; syncRub(); }          // changed $ → ₽ follows the rate
    if(e.target.name==='rub_paid_override') rubAuto = p.rub_paid_override.value.trim()==='';   // typed ₽ by hand → keep it
    if(e.target.name==='rub_paid_override' && rubAuto) syncRub();
    sums()};
  p.onchange=p.oninput;
  const unpaidMode=()=>{const u=!+f.topup.value; document.getElementById('usdLbl').textContent=u?'Примерно $ (не оплачен)':'Оплачено, $';
    p.rub_paid_override.closest('.field').style.display=u?'none':'';
    p.paid.closest('.two').style.display=u?'none':'';
    if(u) p.paid_date.value=''; else if(!p.paid_date.value) p.paid_date.value=new Date().toLocaleDateString('ru-RU')};
  f.topup.addEventListener('change',()=>{unpaidMode();syncRub();sums()});
  if(!inv.topup_id && inv.est_usd && !inv.usd_paid) p.usd_paid.value=inv.est_usd;
  unpaidMode();
  f.farm.onchange=()=>{const m=FARMS.find(x=>x.name.toLowerCase()===f.farm.value.toLowerCase());if(m&&!f.country.value)f.country.value=m.country};
  document.getElementById('addLine').onclick=()=>{inv.lines.push({name:'',stems:'',price_usd:''});drawLines()};
  drawLines();

  const drop=document.getElementById('drop'), file=document.getElementById('file');
  drop.onclick=()=>file.click();
  file.onchange=async()=>{ if(!file.files[0])return; drop.classList.add('busy'); drop.textContent='Читаю документ…';
    try{const fd=new FormData();fd.append('file',file.files[0]);const r=await api('/parse',{method:'POST',body:fd});
      collect(); applyParsed(inv,r); stack[stack.length-1][1]={t,inv}; render('invoice',{t,inv}); }
    catch(x){toast(x.message);drop.classList.remove('busy');drop.textContent='Загрузить PDF или фото инвойса — AI заполнит'} };
  if(inv._warnings?.length) document.getElementById('aiwarn').innerHTML=`<div class="warn">${inv._warnings.map(w=>`<div>${esc(w)}</div>`).join('')}</div>`;

  function collect(){
    for(const k of ['farm','country','invoice_no','invoice_date','awb','client_code']) inv[k]=f[k].value.trim();
    inv.weight_kg=numOrNull(f.weight_kg.value);
    for(const k of ['invoice_total_usd','usd_paid','rub_paid_override']) inv[k]=numOrNull(p[k].value);
    if(!+f.topup.value){ inv.est_usd=inv.usd_paid; inv.usd_paid=0; inv.rub_paid_override=null; inv.paid=false }
    inv.alloc_mode=p.alloc_mode.value; inv.paid=p.paid.value==='1'; inv.paid_date=p.paid_date.value; inv.note=p.note.value;
    inv.topup_id=+f.topup.value;
  }
  document.getElementById('save').onclick=async()=>{
    collect();
    if(!inv.farm) return toast('Укажи плантацию');
    if(inv.topup_id && (!inv.usd_paid||!inv.rub_paid_override)) return toast('Впиши оплату: $ и ₽');
    if(!inv.topup_id && !inv.est_usd) return toast('Впиши примерную сумму в $');
    const lines=inv.lines.filter(l=>l.name&&numOrNull(l.stems)).map(l=>({name:l.name.trim(),boxes:numOrNull(l.boxes),stems:numOrNull(l.stems),weight_kg:numOrNull(l.weight_kg),price_usd:numOrNull(l.price_usd)||0,mrc:numOrNull(l.mrc)}));
    const {id,_warnings,rub_paid,...body}=inv; body.lines=lines; body.usd_paid=inv.usd_paid;
    const snap=await api('/invoices'+(id?'?inv_id='+id:''),{method:'POST',body});
    if(draft?._draftId) await api('/drafts/'+draft._draftId,{method:'DELETE'});
    if(!inv.topup_id){ toast('Сохранено в «В пути»'); return tab('transit') }
    const moved=inv.topup_id!==t.id;
    toast(moved?'Инвойс перенесён в пополнение '+(TOPS.find(x=>x.id===inv.topup_id)||{}).date:'Инвойс сохранён'); stack.pop();
    const sn=moved?undefined:snap;
    stack[stack.length-1][0]==='topup'?render('topup',{id:t.id,snap:sn}):go('topup',{id:t.id,snap:sn});
  };
  if(inv.id) document.getElementById('del').onclick=async()=>{ if(!confirm('Удалить инвойс?'))return;
    const snap=await api('/invoices/'+inv.id,{method:'DELETE'}); stack.pop(); render('topup',{id:t.id,snap}) };
},

// ======================= LOGISTICS =======================
async logistics({t, lg, draft}){
  lg = lg || {topup_id:t.id,awb:'',leg:'air',provider:'',invoice_no:'',usd:null,rub:null,basis:'auto',paid_date:t.date,note:''};
  let farmKg = lg.farm_kg_json ? JSON.parse(lg.farm_kg_json) : {};
  if(draft){ const fr=draft.freight||{}; Object.assign(lg,{awb:draft.awb||'',provider:fr.provider||draft.farm||'',leg:fr.leg||'air',usd:fr.total_usd??draft.invoice_total_usd,rub:fr.total_rub,weight_kg:draft.total_weight_kg,
      leg:/flora|флора/i.test(fr.provider||draft.farm||'')?'msk':'air',invoice_no:draft.invoice_no||'',source_file:draft.source_file});
    [...(fr.per_farm_kg||[]),...(draft.per_farm_kg||[])].forEach(x=>farmKg[x.farm]=x.kg); }
  $app.innerHTML=`<h1>${lg.id?'Логистика':'Новая логистика'}</h1>
  <p class="sub">Счёт за фрахт по одному MAWB. Делится на все плантации этого MAWB по весу, внутри плантации — по весу/коробкам/стеблям.</p>
  <form id="f" class="group">
    <div class="two"><div class="field"><label>MAWB</label><input name="awb" value="${esc(lg.awb)}"></div>
    <div class="field"><label>Плечо</label><select name="leg"><option value="air" ${lg.leg==='air'?'selected':''}>Expolanka · Кения → Амстердам</option><option value="msk" ${lg.leg==='msk'?'selected':''}>Floratrack</option></select></div></div>
    <div class="two"><div class="field"><label>Перевозчик</label><input name="provider" list="fwd" value="${esc(lg.provider)}" placeholder="Expolanka / Floratrack"><datalist id="fwd"><option value="Expolanka"><option value="Floratrack"></datalist></div>
    <div class="field"><label>Номер счёта</label><input name="invoice_no" value="${esc(lg.invoice_no||'')}"></div></div>
    <div class="two"><div class="field"><label>Сумма, $</label><input name="usd" inputmode="decimal" value="${lg.usd??''}"></div>
    <div class="field"><label>Сумма, ₽</label><input name="rub" inputmode="decimal" value="${lg.rub??''}"></div></div>
    <div class="field"><label>Вес по счёту, кг (ставка ₽/кг = сумма ₽ / этот вес)</label><input name="weight_kg" inputmode="decimal" value="${lg.weight_kg??''}"></div>
    <div class="field"><label>Оплачено из</label><select name="topup"><option value="${t.id}" ${lg.topup_id===t.id?'selected':''}>этого пополнения (${esc(t.date)})</option><option value="" ${lg.topup_id==null?'selected':''}>не из пополнения</option>${lg.topup_id&&lg.topup_id!==t.id?`<option value="${lg.topup_id}" selected>другого пополнения</option>`:''}</select></div>
    <div class="field"><label>Как делить между плантациями</label><select name="basis">${[['auto','По весу, если он есть у всех'],['kg','По весу'],['stems','По стеблям']].map(([v,n])=>`<option value="${v}" ${lg.basis===v?'selected':''}>${n}</option>`).join('')}</select></div>
    <div class="field"><label>Дата оплаты</label><input name="paid_date" value="${esc(lg.paid_date||'')}"></div>
  </form>
  <h2>Разбивка кг по плантациям (этот MAWB)</h2>
  <p class="hint">По ней делится этот фрахт. Можно внести позже — кинь разбивку боту с MAWB в подписи.</p>
  <div class="group" id="kg"><div class="empty">Впиши MAWB — подтяну плантации.</div></div>
  <div class="actions">${lg.id?'<button id="del" class="x">Удалить</button>':''}<button class="primary" id="save">Сохранить</button></div>`;
  const f=document.getElementById('f'), kg=document.getElementById('kg');
  f.provider.addEventListener('change',()=>{const v=f.provider.value;if(/flora|флора/i.test(v))f.leg.value='msk';else if(/expolanka|экспо/i.test(v))f.leg.value='air'});
  let invs=[];
  const loadAwb=async()=>{ const a=f.awb.value.trim(); if(!a)return;
    const r=await api('/weights/'+encodeURIComponent(a));
    const merged={...r.farm_kg,...farmKg};                 // saved breakdown + whatever came with this document
    const same=(x,y)=>x.toLowerCase().slice(0,4)===y.toLowerCase().slice(0,4);
    const rows=[...Object.keys(merged)];
    r.invoices.forEach(i=>{ if(!rows.some(k=>same(k,i.farm))) rows.push(i.farm) });
    const val=fm=>merged[fm]??r.invoices.find(i=>same(i.farm,fm))?.weight_kg??'';
    const note=fm=>r.invoices.some(i=>same(i.farm,fm))?'':' · инвойса ещё нет';
    kg.innerHTML = rows.length ? rows.map(fm=>`<div class="field"><label>${esc(fm)}${note(fm)}</label><input data-farm="${esc(fm)}" inputmode="decimal" value="${val(fm)}"></div>`).join('')
      + `<div class="hint num" style="padding:8px 14px" id="kgtot"></div>`
      : '<div class="empty">Разбивки кг пока нет. Кинь её боту с MAWB в подписи — встанет сюда сама. Или впиши вручную ниже, когда появятся инвойсы.</div>';
    const tot=()=>{let x=0;kg.querySelectorAll('input[data-farm]').forEach(i=>x+=numOrNull(i.value)||0);const e=document.getElementById('kgtot');if(e)e.textContent=`Итого ${fmt(x,1)} кг`};
    kg.oninput=tot; tot();
  };
  f.awb.onchange=loadAwb; loadAwb();
  document.getElementById('save').onclick=async()=>{
    const body={awb:f.awb.value.trim(),leg:f.leg.value,provider:f.provider.value.trim(),invoice_no:f.invoice_no.value.trim(),usd:numOrNull(f.usd.value),rub:numOrNull(f.rub.value),
      weight_kg:numOrNull(f.weight_kg.value),
      topup_id:f.topup.value?+f.topup.value:null,basis:f.basis.value,paid_date:f.paid_date.value,note:lg.note||'',source_file:lg.source_file||null,farm_kg:{}};
    kg.querySelectorAll('[data-farm]').forEach(i=>{const v=numOrNull(i.value);if(v)body.farm_kg[i.dataset.farm]=v});
    if(!body.awb) return toast('Нужен MAWB');
    if(!body.usd&&!body.rub) return toast('Нужна сумма в $ или ₽');
    if(!body.rub) return toast('Впиши сумму в ₽');
    const snap=await api(`/logistics?view_topup=${t.id}`+(lg.id?'&log_id='+lg.id:''),{method:'POST',body});
    if(draft?._draftId) await api('/drafts/'+draft._draftId,{method:'DELETE'});
    toast('Логистика сохранена'); stack.pop(); stack[stack.length-1][0]==='topup'?render('topup',{id:t.id,snap}):go('topup',{id:t.id,snap});
  };
  if(lg.id) document.getElementById('del').onclick=async()=>{ if(!confirm('Удалить?'))return;
    const snap=await api(`/logistics/${lg.id}?view_topup=${t.id}`,{method:'DELETE'}); stack.pop(); render('topup',{id:t.id,snap}) };
},

// ======================= KG BREAKDOWN PER MAWB =======================
async weights({t, awb, draft}){
  let kg = {}, srcFile = null, warns = [];
  if(draft){ awb = draft.awb||''; srcFile = draft.source_file; warns = draft.warnings||[];
    [...(draft.per_farm_kg||[]),...(draft.freight?.per_farm_kg||[])].forEach(x=>kg[x.farm]=x.kg); }
  $app.innerHTML=`<h1>Разбивка кг</h1>
  <p class="sub">Сколько кг каждой плантации в MAWB. По ней делится фрахт перевозчика. HAWB не нужен.</p>
  <div class="drop" id="drop">Загрузить разбивку (PDF / фото) — AI заполнит</div><input type="file" id="file" accept="application/pdf,image/*" hidden>
  <div id="w"></div>
  <form id="f" class="group" style="margin-top:12px"><div class="field"><label>MAWB</label><input name="awb" value="${esc(awb||'')}" placeholder="065-4053 8245"></div></form>
  <h2>Плантации</h2><div class="group" id="list"><div class="empty">Впиши MAWB.</div></div>
  <div class="actions"><button class="ghost" id="addRow">+ плантация, которой ещё нет</button></div>
  <div class="hint num" id="tot" style="margin:0 16px"></div>
  <div class="actions"><button class="primary" id="save">Сохранить разбивку</button></div>`;
  const f=document.getElementById('f'), list=document.getElementById('list');
  const showW=()=>document.getElementById('w').innerHTML=warns.length?`<div class="warn">${warns.map(w=>`<div>${esc(w)}</div>`).join('')}</div>`:'';
  const total=()=>{let x=0;list.querySelectorAll('input[data-farm]').forEach(i=>x+=numOrNull(i.value)||0);document.getElementById('tot').textContent=x?`Итого ${fmt(x,1)} кг`:''};
  const draw=async()=>{
    const a=f.awb.value.trim(); if(!a) return;
    const r=await api('/weights/'+encodeURIComponent(a));
    const merged={...r.farm_kg,...kg};
    const farms=[...new Set([...r.invoices.map(i=>i.farm),...Object.keys(merged)])];
    const val=fm=>{const k=Object.keys(merged).find(k=>k.toLowerCase()===fm.toLowerCase());return k!=null?merged[k]:(r.invoices.find(i=>i.farm===fm)?.weight_kg??'')};
    list.innerHTML=farms.length?farms.map(fm=>`<div class="field"><label>${esc(fm)}${r.invoices.some(i=>i.farm.toLowerCase()===fm.toLowerCase())?'':' · инвойса ещё нет'}</label>
      <input data-farm="${esc(fm)}" inputmode="decimal" value="${val(fm)}"></div>`).join(''):'<div class="empty">На этом MAWB пока ничего. Добавь плантации вручную или загрузи документ.</div>';
    total();
  };
  list.oninput=total; f.awb.onchange=draw; draw(); showW();
  document.getElementById('addRow').onclick=()=>{const n=prompt('Название плантации');if(!n)return;
    if(list.querySelector('.empty'))list.innerHTML='';
    list.insertAdjacentHTML('beforeend',`<div class="field"><label>${esc(n)} · инвойса ещё нет</label><input data-farm="${esc(n)}" inputmode="decimal"></div>`)};
  const drop=document.getElementById('drop'), file=document.getElementById('file');
  drop.onclick=()=>file.click();
  file.onchange=async()=>{ if(!file.files[0])return; drop.classList.add('busy'); drop.textContent='Читаю…';
    try{const fd=new FormData();fd.append('file',file.files[0]);const r=await api('/parse',{method:'POST',body:fd});
      [...(r.per_farm_kg||[]),...(r.freight?.per_farm_kg||[])].forEach(x=>kg[x.farm]=x.kg);
      if(r.awb&&!f.awb.value.trim()) f.awb.value=r.awb; srcFile=r.source_file; warns=r.warnings||[]; showW(); await draw();}
    catch(x){toast(x.message)} drop.classList.remove('busy'); drop.textContent='Загрузить разбивку (PDF / фото) — AI заполнит'};
  document.getElementById('save').onclick=async()=>{
    const body={awb:f.awb.value.trim(),farm_kg:{},source_file:srcFile};
    list.querySelectorAll('input[data-farm]').forEach(i=>{const v=numOrNull(i.value);if(v)body.farm_kg[i.dataset.farm]=v});
    if(!body.awb) return toast('Нужен MAWB');
    if(!Object.keys(body.farm_kg).length) return toast('Впиши кг хотя бы для одной плантации');
    await api('/weights',{method:'POST',body});
    if(draft?._draftId) await api('/drafts/'+draft._draftId,{method:'DELETE'});
    toast('Разбивка сохранена'); stack.pop(); if(!t) return render('home',{});
    stack[stack.length-1]?.[0]==='topup'?render('topup',{id:t.id}):go('topup',{id:t.id});
  };
},

// ======================= DRAFT -> pick top-up =======================
async draft({d,tops}){
  $app.innerHTML=`<h1>${esc(d.farm||d.freight?.provider||'Черновик')}</h1>
  <p class="sub">${d.doc_type==='farm_invoice'?'Инвойс плантации':d.doc_type==='kg_breakdown'?'Разбивка кг по плантациям':'Счёт за логистику'} · MAWB ${esc(d.awb||'?')}. Из какого пополнения оплачен?</p>
  ${d.warnings?.length?`<div class="warn">${d.warnings.map(w=>`<div>${esc(w)}</div>`).join('')}</div>`:''}
  <div class="group" style="margin-top:12px">${tops.map(t=>`<div class="row" data-t="${t.id}"><div class="grow"><div class="t">${esc(t.date)}</div><div class="s num">$${fmt(t.usd,2)}</div></div></div>`).join('')||'<div class="empty">Сначала создай пополнение.</div>'}</div>
  <div class="actions"><button class="x" id="drop">Выбросить черновик</button></div>`;
  $app.querySelectorAll('[data-t]').forEach(e=>e.onclick=()=>{const t=tops.find(x=>x.id==e.dataset.t); d._draftId=d.id;
    stack.pop(); go(d.doc_type==='farm_invoice'?'invoice':d.doc_type==='kg_breakdown'?'weights':'logistics',{t,draft:d})});

},

// ======================= В ПУТИ =======================
async transit(){
  const v=await api('/transit');

  $app.innerHTML=`<h1>Груз в пути</h1>
  <p class="sub">≈ по курсу ${fmt(v.est_rate,2)} (пополнение ${esc(v.est_topup||'—')}). Приблизительная себестоимость — отклонение до ±10%.</p>
  ${Object.keys(by).length?Object.entries(by).map(([awb,list])=>`<h2>${awb==='без MAWB'?'MAWB ещё не известен':'MAWB '+esc(awb)}${list.find(x=>x.eta)?' · '+eta(list.find(x=>x.eta)):''}</h2>
    <div class="group">${list.map(i=>`<div class="row" data-ti="${i.id}"><div class="grow">
      <div class="t">${esc(i.farm)}</div>
      <div style="margin:3px 0"><span class="pill ${i.paid_state==='paid'?'ok':'warn'}">${i.paid_state==='paid'?'оплачен · '+esc(i.topup):'не оплачен'}</span></div>
      <div class="s num">${fmt(i.stems)} ст${i.paid_state==='paid'?'':' · ≈$'+fmt(i.est_usd||0,0)}</div>
      <div class="s num">${legsOf(i).map(l=>`${l.name} ${fmt(l.per,2)}`).join(' + ')} ₽/ст</div></div>
      <div class="v"><div class="num">${i.approx?'≈ ':''}${fmt(i.avg_rub,2)} ₽</div><div class="s">${i.approx?'±10% · ':''}за стебель</div></div></div>`).join('')}</div>`).join('')
    :'<div class="empty">Всё прибыло — в пути ничего нет.</div>'}
  ${v.unpaid_logistics.length?`<h2>Неоплаченная логистика</h2><div class="group">${v.unpaid_logistics.map(l=>`<div class="row"><div class="grow">
      <div class="t">${esc(l.provider||'Фрахт')}</div><div style="margin:3px 0"><span class="pill warn">не оплачен</span></div><div class="s">MAWB ${esc(l.awb)}</div></div>

  $app.querySelectorAll('[data-ti]').forEach(e=>e.onclick=()=>go('transitInv',{i:v.invoices.find(x=>x.id==e.dataset.ti),v}));
  $app.querySelectorAll('[data-pl]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();payForm({kind:'logistics',id:+b.dataset.pl,usd:v.unpaid_logistics.find(x=>x.id==b.dataset.pl).usd})});
  document.getElementById('addT').onclick=()=>go('invoice',{t:{id:0,date:'в пути'}});
  if(!ME.can_write) document.getElementById('addT').style.display='none';
},

async stock(){
  const v=await api('/transit');
  const paid=v.invoices.filter(i=>i.paid_state==='paid'), unpaid=v.invoices.filter(i=>i.paid_state!=='paid');

    <div class="group"><div class="row"><div class="grow"><div class="big num">${approx?'≈ ':''}${fmt(sum(list,'rub_goods')+sum(list,'rub_logi'))} ₽</div>

    ${list.map(i=>`<div class="row" data-ti="${i.id}"><div class="grow"><div class="t">${esc(i.farm)}</div><div class="s">MAWB ${esc(i.awb||'?')} · ${fmt(i.stems)} ст</div></div>

  $app.innerHTML=`<h1>Товарные остатки</h1>
  <p class="sub">Рублёвые суммы груза в пути по инвойсам: товар + логистика. Неоплаченные — по курсу ${fmt(v.est_rate,2)} (пополнение ${esc(v.est_topup||'—')}).</p>
  ${block('Оплаченные в пути',paid,paid.some(i=>i.approx))}

},

// logistics legs shown for an invoice: ТК Кения only for Kenya (or when it has money), ТК МСК always

// «Оплачен»: which top-up + $ (₽ by that top-up's rate unless typed)
async function payForm({kind,id,usd}){
  const tops=await api('/topups');
  const wrap=document.createElement('div');
  wrap.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end';
  wrap.innerHTML=`<div style="background:var(--bg2);width:100%;border-radius:18px 18px 0 0;padding:14px 0 calc(16px + env(safe-area-inset-bottom,0))">
    <h2 style="margin-top:4px">Из какого пополнения оплачен?</h2>
    <div class="group">${tops.slice(0,8).map((t,n)=>`<label class="row"><input type="radio" name="tp" value="${t.id}" ${n?'':'checked'}><div class="grow"><div class="t">${esc(t.date)}</div><div class="s num">курс ${fmt(t.rate,2)}</div></div></label>`).join('')}</div>
    <form class="group" style="margin-top:10px"><div class="two"><div class="field"><label>Оплачено, $</label><input name="usd" inputmode="decimal" value="${usd??''}"></div>
    <div class="field"><label>₽ (пусто = по курсу)</label><input name="rub" inputmode="decimal"></div></div></form>
    <div class="actions"><button id="pcancel">Отмена</button><button class="primary" id="pok">Оплачен</button></div></div>`;
  document.body.appendChild(wrap);
  const close=()=>wrap.remove();
  wrap.querySelector('#pcancel').onclick=close;
  wrap.querySelector('#pok').onclick=async()=>{
    const f=wrap.querySelector('form'); const tp=+wrap.querySelector('input[name=tp]:checked')?.value;
    const body={topup_id:tp,usd:numOrNull(f.usd.value),rub:numOrNull(f.rub.value)};
    if(!tp) return toast('Выбери пополнение'); if(kind==='invoices'&&!body.usd) return toast('Впиши $');
    try{ await api(`/${kind}/${id}/pay`,{method:'POST',body}); close(); toast('Оплачено — себестоимость теперь точная'); tab('transit') }catch(e){toast(e.message)}
  };
}

// "Excel в чат": this top-up or all of them — native Telegram popup, plain confirm as fallback
function askExport(date){
  return new Promise(res=>{
    if(tg?.showPopup && tg.isVersionAtLeast?.('6.2')){
      tg.showPopup({title:'Excel в чат', message:'Какой учёт прислать?',
        buttons:[{id:'one',type:'default',text:`Только ${date.slice(0,5)}`},{id:'all',type:'default',text:'Все пополнения'},{type:'cancel'}]},
        id=>res(id==='one'||id==='all'?id:null));
    } else {
      res(confirm(`Прислать только пополнение ${date}?\nОК — только его, Отмена — все пополнения`)?'one':'all');
    }
  });
}

function applyParsed(inv, r){
  Object.assign(inv,{farm:r.farm||inv.farm,country:r.country||inv.country,invoice_no:r.invoice_no||inv.invoice_no,
    invoice_date:r.invoice_date||inv.invoice_date,awb:r.awb||inv.awb,invoice_total_usd:r.invoice_total_usd??inv.invoice_total_usd,
    weight_kg:r.weight_kg??inv.weight_kg,
    source_file:r.source_file,_warnings:[...(r.mawb_note?[r.mawb_note]:[]),...(r.warnings||[])]});
  if(r.lines?.length) inv.lines=r.lines.map(l=>({name:l.name,boxes:l.boxes,stems:l.stems,weight_kg:l.weight_kg,price_usd:l.price_usd}));
  if(!inv.usd_paid && r.invoice_total_usd) inv._warnings.push('Суммы оплаты $ и ₽ впиши сам — из инвойса не подставляю.');
}
